<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tessera</title>
<style>
  :root { --bg:#0b0e14; --fg:#e6e9ef; --dim:#8b93a7; --edge:#2b3346; --accent:#7aa2f7; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
  canvas { display:block; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  #hud { position:fixed; top:14px; left:16px; pointer-events:none; }
  #hud h1 { margin:0; font-size:18px; letter-spacing:.14em; font-weight:600; }
  #hud .sub { color:var(--dim); font-size:11px; margin-top:2px; }
  #panel { position:fixed; top:0; right:0; width:340px; max-width:82vw; height:100%;
    background:rgba(16,20,30,.94); border-left:1px solid #1c2432; padding:20px 20px 24px;
    overflow-y:auto; transform:translateX(100%); transition:transform .18s ease; }
  #panel.open { transform:translateX(0); }
  #panel .type { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.1em; }
  #panel h2 { margin:4px 0 10px; font-size:17px; }
  #panel .body { color:#c3c9d6; white-space:pre-wrap; max-height:38vh; overflow:auto;
    border:1px solid #1c2432; border-radius:8px; padding:10px; background:#0d111a; font-size:12px; }
  #panel .nlabel { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin:16px 0 6px; }
  #panel .chip { display:inline-block; margin:0 6px 6px 0; padding:5px 9px; border-radius:14px;
    background:#161c28; border:1px solid #26304a; color:#d6dbe6; cursor:pointer; font-size:12px; }
  #panel .chip:hover { background:#20293c; border-color:var(--accent); }
  #panel .close { position:absolute; top:12px; right:14px; color:var(--dim); cursor:pointer; font-size:20px; }
  #tip { position:fixed; pointer-events:none; background:#0d111a; border:1px solid #26304a;
    border-radius:6px; padding:6px 9px; font-size:12px; color:#d6dbe6; max-width:320px; display:none; z-index:5; }
  #help { position:fixed; bottom:12px; left:16px; color:var(--dim); font-size:11px; pointer-events:none; }
  #legend { position:fixed; bottom:12px; right:16px; background:rgba(13,17,26,.82); border:1px solid #1c2432;
    border-radius:8px; padding:9px 11px; font-size:11px; color:var(--dim); max-width:220px; }
  #legend .row { display:flex; align-items:center; gap:7px; margin:3px 0; }
  #legend .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  #legend .ln { width:16px; height:0; border-top:2px solid; flex:0 0 auto; }
  #pmeta { margin:2px 0 4px; }
  #pmeta .kv { display:inline-block; margin:0 8px 6px 0; color:#c3c9d6; }
  #pmeta .kv b { color:var(--dim); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.06em; margin-right:4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h1>TESSERA</h1><div class="sub" id="counts"></div></div>
<div id="tip"></div>
<div id="help">scroll = zoom · drag = pan · click = focus · right-click = inspect · hover edge = why · h = show/hide provenance</div>
<div id="legend"></div>
<div id="panel"><span class="close" id="pclose">×</span>
  <div class="type" id="ptype"></div><h2 id="ptitle"></h2>
  <div id="pmeta"></div>
  <div class="body" id="pbody"></div>
  <div class="nlabel" id="pnlabel">connections</div><div id="pneighbors"></div>
</div>
<script>
const GRAPH = /*__GRAPH_DATA__*/ {nodes:[],edges:[]};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio||1, 2);
function resize(){ W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();
const $=id=>document.getElementById(id);

// Escape model/user-controlled strings before ANY innerHTML interpolation (a name like "<img onerror=…>"
// must not execute). textContent paths (title, body, tooltip, chips) need no escaping.
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- model (positions seeded on a ring, then settled) ---
const nodes = GRAPH.nodes.map((n,i)=>({ ...n,
  x: Math.cos(i)*220 + (i%7-3)*30, y: Math.sin(i)*220 + (i%5-2)*30, vx:0, vy:0, deg:0 }));
const byId = new Map(nodes.map(n=>[n.id,n]));
const edges = GRAPH.edges.map(e=>({ ...e, a:byId.get(e.from), b:byId.get(e.to) })).filter(e=>e.a&&e.b);

// Provenance nodes (the document + its chunks) are PRESENT in the data but hidden by default — they're the
// RAG substrate, not the semantic map. Press 'h' to reveal them (and their APPEARED_IN/ORIGINATED_FROM edges).
const isProv = n => n.type==='SOURCE' && (n.group==='chunk' || n.group==='document');
let showProv = false;
let NODES=[], EDGES=[], maxDeg=1;
function rebuild(){
  const vis = new Set(nodes.filter(n=>showProv||!isProv(n)));
  NODES = [...vis];
  EDGES = edges.filter(e=>vis.has(e.a)&&vis.has(e.b));
  for(const n of NODES) n.deg=0;
  for(const e of EDGES){ e.a.deg++; e.b.deg++; }   // degree over VISIBLE edges → size = semantic connectivity
  maxDeg = Math.max(1, ...NODES.map(n=>n.deg));
  settle(); buildLegend(); updateCounts();
}
function updateCounts(){
  const people = NODES.filter(n=>n.type==='PERSON').length;
  $('counts').textContent = people+' people · '+(NODES.length-people)+' other · '+EDGES.length+' links'+(showProv?' · +provenance':'');
}

// --- colour: coarse buckets, deliberately few. Person vs. the rest, because 7 shades of one hue don't read.
// Add a bucket to `bucket()` when a group EARNS its own colour (place is the obvious next candidate). ---
const NODE_COLORS = { person:'#e0af68', place:'#9ece6a', org:'#7dcfff', other:'#7f8aa3' };
function bucket(n){ return n.type==='PERSON' ? 'person' : 'other'; } // e.g. add: n.group==='place'?'place':…
function colorFor(n){ return NODE_COLORS[bucket(n)] || NODE_COLORS.other; }
function radius(n){ const base = n.type==='PERSON' ? 5 : 4; return base + 10*Math.sqrt(n.deg/maxDeg); }

function buildLegend(){
  const label = { person:'person', place:'place', org:'organization', other:'everything else' };
  const order = ['person','place','org','other'];
  const present = [...new Set(NODES.map(bucket))].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  const hasReson = EDGES.some(e=>e.kind==='RESONATES_WITH');
  $('legend').innerHTML = present.map(g=>'<div class="row"><span class="dot" style="background:'+NODE_COLORS[g]+'"></span>'+esc(label[g]||g)+'</div>').join('')
    + (hasReson ? '<div class="row" style="margin-top:6px"><span class="ln" style="border-color:#f7768e"></span>resonates with</div>' : '');
}

// --- force layout: settle ONCE (here / on toggle), then FREEZE. Moving nodes only induced churn, so the
// layout is static after this — pan & zoom move the camera, not the graph. ---
function settle(){
  const kRep=5200, kSpring=0.045, rest=90, grav=0.012;
  for(const n of NODES){ n.vx=0; n.vy=0; }
  for(let it=0; it<500; it++){
    const alpha = Math.max(0.03, Math.pow(0.992, it));
    for(let i=0;i<NODES.length;i++){ const a=NODES[i];
      for(let j=i+1;j<NODES.length;j++){ const b=NODES[j];
        let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2);
        const f=kRep/d2, fx=f*dx/d, fy=f*dy/d; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy; }
      a.vx-=a.x*grav; a.vy-=a.y*grav;
    }
    for(const e of EDGES){ let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, d=Math.hypot(dx,dy)||0.01;
      const f=kSpring*(d-rest), fx=f*dx/d, fy=f*dy/d; e.a.vx+=fx; e.a.vy+=fy; e.b.vx-=fx; e.b.vy-=fy; }
    for(const n of NODES){ n.x+=n.vx*alpha; n.y+=n.vy*alpha; n.vx*=0.82; n.vy*=0.82; }
  }
}

// --- camera ---
let scale=1, ox=W/2, oy=H/2;
function toScreen(x,y){ return [x*scale+ox, y*scale+oy]; }
function toWorld(px,py){ return [(px-ox)/scale, (py-oy)/scale]; }

// --- interaction state (no node dragging) ---
let hoverNode=null, hoverEdge=null, selected=null, panning=false, lastX=0, lastY=0, downX=0, downY=0;

function draw(){
  ctx.clearRect(0,0,W,H);
  const focusSet = selected ? new Set([selected.id, ...EDGES.filter(e=>e.a===selected||e.b===selected).flatMap(e=>[e.a.id,e.b.id])]) : null;
  for(const e of EDGES){
    const [ax,ay]=toScreen(e.a.x,e.a.y), [bx,by]=toScreen(e.b.x,e.b.y);
    const on = e===hoverEdge || (focusSet && (e.a===selected||e.b===selected));
    const reson = e.kind==='RESONATES_WITH';
    ctx.strokeStyle = on ? '#ffffff'
      : (focusSet ? (reson?'#3a2a44':'#1a2130')
      : (reson ? 'rgba(247,118,142,0.30)' : 'rgba(120,140,180,'+(0.10+0.4*Math.min(1,(e.w||1)/4))+')'));
    ctx.lineWidth = on ? 2 : (reson ? 1.3 : 1);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  for(const n of NODES){
    const [x,y]=toScreen(n.x,n.y), rr=radius(n);
    const dim = focusSet && !focusSet.has(n.id);
    const col = colorFor(n);
    ctx.globalAlpha = dim ? 0.18 : 1;
    const g=ctx.createRadialGradient(x,y,0,x,y,rr*2.4);        // soft glow halo
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rr*2.4,0,7); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill();   // core
    if(n===selected||n===hoverNode){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
  ctx.font='12px -apple-system,sans-serif'; ctx.textAlign='center';
  const showLabel = n => n===hoverNode || n===selected || n.deg >= Math.max(2, maxDeg*0.5) || (focusSet&&focusSet.has(n.id)&&scale>0.7);
  for(const n of NODES){ if(!showLabel(n)) continue; if(focusSet && !focusSet.has(n.id)) continue;
    const [x,y]=toScreen(n.x,n.y); const t=(n.label||'').slice(0,34);
    ctx.fillStyle='rgba(11,14,20,0.75)'; const w=ctx.measureText(t).width;
    ctx.fillRect(x-w/2-4, y+radius(n)+3, w+8, 15);
    ctx.fillStyle='#e6e9ef'; ctx.fillText(t, x, y+radius(n)+14);
  }
  requestAnimationFrame(draw);
}

// --- hit testing (visible nodes/edges only) ---
function nodeAt(px,py){ let best=null,bd=1e9;
  for(const n of NODES){ const [x,y]=toScreen(n.x,n.y); const d=Math.hypot(px-x,py-y); if(d<radius(n)+6 && d<bd){bd=d;best=n;} }
  return best; }
function edgeAt(px,py){ let best=null,bd=7;
  for(const e of EDGES){ const [ax,ay]=toScreen(e.a.x,e.a.y),[bx,by]=toScreen(e.b.x,e.b.y);
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1; let t=((px-ax)*dx+(py-ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const cx=ax+t*dx, cy=ay+t*dy, d=Math.hypot(px-cx,py-cy); if(d<bd){bd=d;best=e;} }
  return best; }

const tip=$('tip');
cv.addEventListener('mousemove', ev=>{
  const px=ev.clientX, py=ev.clientY;
  if(panning){ ox+=px-lastX; oy+=py-lastY; lastX=px; lastY=py; return; }
  hoverNode=nodeAt(px,py); hoverEdge=hoverNode?null:edgeAt(px,py);
  if(hoverEdge){ tip.style.display='block'; tip.style.left=(px+12)+'px'; tip.style.top=(py+12)+'px';
    // the reason IS the insight — don't prefix "A ↔ B" (formulaic, and the endpoints are already the two nodes
    // the edge visibly joins). Fall back to endpoint names only when there's no reason.
    tip.textContent = hoverEdge.reason || ((hoverEdge.a.label||'')+'  —  '+(hoverEdge.b.label||'')); }
  else if(hoverNode){ tip.style.display='block'; tip.style.left=(px+12)+'px'; tip.style.top=(py+12)+'px'; tip.textContent=hoverNode.label; }
  else tip.style.display='none';
  cv.style.cursor=(hoverNode||hoverEdge)?'pointer':'grab';
});
cv.addEventListener('mousedown', ev=>{ if(ev.button!==0) return; panning=true; cv.classList.add('dragging'); lastX=downX=ev.clientX; lastY=downY=ev.clientY; });
addEventListener('mouseup', ev=>{ if(ev.button!==0) return;
  const moved = Math.hypot(ev.clientX-downX, ev.clientY-downY) >= 4; // click vs. drag
  if(panning && !moved){ const n=nodeAt(ev.clientX,ev.clientY); if(n) select(n); else { const e=edgeAt(ev.clientX,ev.clientY); e?inspectEdge(e):deselect(); } }
  panning=false; cv.classList.remove('dragging'); });
// right-click = deep inspect (node or edge)
cv.addEventListener('contextmenu', ev=>{ ev.preventDefault(); const n=nodeAt(ev.clientX,ev.clientY);
  if(n){ inspectNode(n); return; } const e=edgeAt(ev.clientX,ev.clientY); if(e) inspectEdge(e); });
cv.addEventListener('wheel', ev=>{ ev.preventDefault(); const [wx,wy]=toWorld(ev.clientX,ev.clientY);
  scale*=ev.deltaY<0?1.1:0.9; scale=Math.max(0.15,Math.min(6,scale)); ox=ev.clientX-wx*scale; oy=ev.clientY-wy*scale; }, {passive:false});

// --- panel: light focus (left-click) + deep inspect (right-click) ---
const panel=$('panel');
function neighborsOf(n){ return EDGES.filter(e=>e.a===n||e.b===n).map(e=>({ node:e.a===n?e.b:e.a, reason:e.reason, kind:e.kind })); }
function provenanceOf(n){ return edges.filter(e=>e.a===n && e.kind==='APPEARED_IN').map(e=>e.b.label).filter(Boolean); }
function chips(box, list, onpick){ list.forEach(node=>{ const c=document.createElement('span'); c.className='chip';
  c.textContent=node.label||node.id; c.onclick=()=>onpick(node); box.appendChild(c); }); }

// left-click: focus the neighbourhood + brief detail, and let you walk via the connection chips
function select(n){ selected=n; panel.classList.add('open');
  $('ptype').textContent=(n.group||n.type||'')+(n.deg?(' · '+n.deg+' links'):'');
  $('ptitle').textContent=n.label||n.id;
  $('pmeta').innerHTML='';
  $('pbody').textContent=((n.meta&&(n.meta.description||n.meta.bio))||n.text||'');
  $('pnlabel').textContent='connections';
  const box=$('pneighbors'); box.innerHTML='';
  chips(box, neighborsOf(n).sort((a,b)=>b.node.deg-a.node.deg).map(x=>x.node), node=>{ select(node); centerOn(node); });
}
// right-click a node: everything — id/identity/strength/degree, full description, provenance, neighbours by kind + reason
function inspectNode(n){ selected=n; panel.classList.add('open');
  $('ptype').textContent=(n.group?(n.type+' / '+n.group):n.type)+' · inspect';
  $('ptitle').textContent=n.label||n.id;
  const md=n.meta||{}, prov=provenanceOf(n);
  const kv=[['id',n.id],['strength',n.strength],['degree',n.deg],['identity',n.text]].filter(r=>r[1]!=null);
  $('pmeta').innerHTML=kv.map(r=>'<span class="kv"><b>'+esc(r[0])+'</b>'+esc(r[1])+'</span>').join('');
  $('pbody').textContent=(md.description||md.bio||n.text||'');
  $('pnlabel').textContent='connections';
  const box=$('pneighbors'); box.innerHTML='';
  const nb=neighborsOf(n);
  [...new Set(nb.map(x=>x.kind))].forEach(k=>{ const h=document.createElement('div'); h.className='nlabel'; h.textContent=k; box.appendChild(h);
    nb.filter(x=>x.kind===k).forEach(({node,reason})=>{ const row=document.createElement('div'); row.style.margin='0 0 7px';
      const c=document.createElement('span'); c.className='chip'; c.textContent=node.label||node.id; c.onclick=()=>{ inspectNode(node); centerOn(node); }; row.appendChild(c);
      if(reason){ const r=document.createElement('div'); r.style.cssText='color:#8b93a7;font-size:11px;margin:3px 2px 0'; r.textContent=reason; row.appendChild(r); }
      box.appendChild(row); }); });
  // 'derived from' — the source chunk(s), shown even when provenance is hidden on the map. So a node with no
  // semantic links still shows its origin: it was never truly unlinked — its RELATED edges just don't exist yet.
  if(prov.length){ const h=document.createElement('div'); h.className='nlabel'; h.textContent='derived from'; box.appendChild(h);
    prov.forEach(label=>{ const d=document.createElement('div'); d.style.cssText='color:#8b93a7;font-size:12px;margin:0 2px 5px'; d.textContent=label; box.appendChild(d); }); }
  if(!nb.length && !prov.length){ const d=document.createElement('div'); d.style.cssText='color:#8b93a7;font-size:12px'; d.textContent='floating — no links or provenance'; box.appendChild(d); }
}
// right-click an edge: endpoints, kind, weight, and EVERY assertion reason
function inspectEdge(e){ selected=null; panel.classList.add('open');
  $('ptype').textContent=e.kind+' edge · inspect';
  $('ptitle').textContent=(e.a.label||e.a.id)+'  ↔  '+(e.b.label||e.b.id);
  const kv=[['kind',e.kind],['weight',e.w],['polarity',e.polarity]].filter(r=>r[1]!=null);
  $('pmeta').innerHTML=kv.map(r=>'<span class="kv"><b>'+esc(r[0])+'</b>'+esc(r[1])+'</span>').join('');
  const reasons=(e.reasons&&e.reasons.length)?e.reasons:(e.reason?[e.reason]:[]);
  $('pbody').textContent=reasons.length?reasons.map((r,i)=>(reasons.length>1?(i+1)+'. ':'')+r).join('\n\n'):'(no reason recorded)';
  $('pnlabel').textContent='endpoints';
  const box=$('pneighbors'); box.innerHTML='';
  chips(box, [e.a,e.b], node=>{ inspectNode(node); centerOn(node); });
}
function deselect(){ selected=null; panel.classList.remove('open'); }
function centerOn(n){ ox=W/2-n.x*scale; oy=H/2-n.y*scale; }
$('pclose').onclick=deselect;
addEventListener('keydown', e=>{ if(e.key==='Escape') deselect(); else if(e.key==='h'||e.key==='H'){ showProv=!showProv; rebuild(); } });

rebuild(); draw();
</script>
</body>
</html>
