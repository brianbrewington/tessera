<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tessera</title>
<style>
  /* design tokens (from the Claude Design handoff) */
  :root{
    --ground:#0a0c11; --ground-2:#0e1218;
    --surface:#12161e; --surface-2:#171c26; --surface-3:#1e2531;
    --line:rgba(230,233,239,.09); --line-2:rgba(230,233,239,.16);
    --text:#e6e9ef; --dim:#8b93a7; --faint:#5e667b;
    --accent:#7aa2f7; --person:#e0af68; --tour:#bb9af7; --agent:#7dcfff; --conflict:#f7768e; --ok:#9ece6a;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--ground); color:var(--text); font:13px/1.5 var(--font); overflow:hidden; }
  canvas{ display:block; cursor:grab; }
  canvas.dragging{ cursor:grabbing; }
  button{ font-family:inherit; }

  #pill{ position:fixed; top:14px; left:14px; display:flex; align-items:center; gap:9px; height:38px; padding:0 14px;
    background:rgba(18,22,30,.9); border:1px solid var(--line-2); border-radius:10px; }
  #pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #pill .gname{ font-weight:600; font-size:13px; }
  #pill .gcount{ font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.04em; }

  #tip{ position:fixed; pointer-events:none; background:var(--surface-2); border:1px solid var(--line-2);
    border-radius:8px; padding:7px 10px; font-size:12.5px; line-height:1.5; color:var(--text); max-width:280px; display:none; z-index:6; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #tip .k{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); display:block; margin-bottom:3px; }
  #legend{ position:fixed; bottom:214px; left:14px; background:rgba(13,17,26,.86); border:1px solid var(--line);
    border-radius:10px; padding:9px 11px; font-size:11px; color:var(--dim); }
  /* semantic-zoom chrome — kept on the LEFT so it clears the right-side panel */
  #altrail{ position:fixed; top:62px; left:14px; width:200px; background:rgba(13,17,26,.72); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px 8px 18px; pointer-events:none; }
  #altrail .r{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:2px 0; opacity:.38; transition:opacity .2s; }
  #altrail .r.on{ opacity:1; }
  #altrail .r .sb{ font-family:var(--mono); font-size:8.5px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; }
  #altrail .track{ position:absolute; left:9px; top:12px; bottom:12px; width:2px; background:var(--line-2); border-radius:2px; }
  #altrail .dot{ position:absolute; left:6px; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); transition:top .25s; }
  #zcrumb{ position:fixed; top:16px; left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--dim); background:rgba(13,17,26,.7); border:1px solid var(--line); border-radius:99px; padding:5px 13px; pointer-events:none; }
  #minimap{ position:fixed; bottom:14px; left:14px; width:268px; background:rgba(13,17,26,.86); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  #minimap .mm-head{ display:flex; justify-content:space-between; align-items:center; padding:6px 10px; font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); }
  #minimap canvas{ display:block; background:#080a0f; cursor:crosshair; }
  /* scenes — saved views, bottom-center rack */
  #scenes{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:6px;
    background:rgba(13,17,26,.86); border:1px solid var(--line); border-radius:99px; padding:6px 10px; max-width:56vw; overflow-x:auto; }
  #scenes .lab{ font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); flex:0 0 auto; }
  #scenes .sc{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text); background:var(--surface-2); border:1px solid var(--line);
    border-radius:99px; padding:4px 10px; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  #scenes .sc:hover{ border-color:var(--accent); }
  #scenes .sc.on{ background:rgba(122,162,247,.14); border-color:rgba(122,162,247,.4); color:#c8d8fc; }
  #scenes .sc .x{ color:var(--faint); font-size:12px; line-height:1; }
  #scenes .sc .x:hover{ color:var(--conflict); }
  #scenes .add{ font-family:var(--mono); font-size:11px; color:var(--dim); background:var(--surface-3); border:1px solid var(--line-2); border-radius:99px; padding:4px 11px; cursor:pointer; flex:0 0 auto; }
  #scenes .add:hover{ border-color:var(--accent); color:var(--text); }
  #scenes input{ font:inherit; font-size:12px; background:var(--surface-3); border:1px solid var(--accent); border-radius:99px; padding:4px 11px; color:var(--text); width:150px; outline:none; }
  /* tours — now-playing bar (violet = tour mode) */
  #nowplaying{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); width:min(860px,86vw); display:none;
    background:rgba(18,22,30,.95); border:1px solid rgba(187,154,247,.35); border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,.7); overflow:hidden; z-index:7; }
  #nowplaying .prog{ display:flex; gap:2px; height:3px; }
  #nowplaying .prog i{ flex:1 1 0; background:var(--surface-3); }
  #nowplaying .prog i.on{ background:var(--tour); }
  #nowplaying .body{ display:flex; align-items:center; gap:12px; padding:10px 14px; }
  #nowplaying .ctrl{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  #nowplaying .b2{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--line-2); background:var(--surface-3); color:var(--text); font-size:12px; }
  #nowplaying .b2.play{ width:42px; height:42px; background:var(--tour); color:#140f1e; border-color:var(--tour); font-size:14px; }
  #nowplaying .mid{ flex:1 1 auto; min-width:0; }
  #nowplaying .st{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--tour); margin-bottom:3px; }
  #nowplaying textarea.narr{ font:inherit; font-size:15px; line-height:1.45; color:var(--text); background:transparent; border:none; outline:none; width:100%; resize:none; }
  #nowplaying .exit{ flex:0 0 auto; color:var(--dim); cursor:pointer; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
  #nowplaying .exit:hover{ color:var(--text); }
  #legend .row{ display:flex; align-items:center; gap:7px; margin:3px 0; }
  #legend .dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  #legend .ln{ width:16px; height:0; border-top:2px solid; flex:0 0 auto; }

  /* panel — one component, depths via .deep / .edge */
  #panel{ position:fixed; top:14px; right:14px; bottom:14px; width:396px; max-width:82vw;
    display:flex; flex-direction:column; background:rgba(18,22,30,.92); border:1px solid var(--line-2);
    border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5); transform:translateX(calc(100% + 24px));
    transition:transform .2s ease, width .18s ease; overflow:hidden; }
  #panel.open{ transform:translateX(0); }
  #panel.deep{ width:470px; background:rgba(18,22,30,.95); box-shadow:0 16px 55px rgba(0,0,0,.6); }
  #panel.edge{ width:452px; }
  .p-head{ display:flex; align-items:center; gap:8px; padding:13px 16px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .p-head .crumb{ flex:1 1 auto; min-width:0; font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-head .crumb b{ color:var(--text); font-weight:500; }
  .p-head .sq{ width:26px; height:26px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:var(--surface-3); border:1px solid var(--line); border-radius:7px; color:var(--dim); cursor:pointer; font-size:14px; }
  .p-head .sq:hover{ color:var(--text); border-color:var(--line-2); }
  .p-head .badge{ font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
    background:rgba(122,162,247,.12); border:1px solid rgba(122,162,247,.3); border-radius:5px; padding:3px 6px; flex:0 0 auto; }
  .p-scroll{ flex:1 1 auto; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:16px; }
  .p-actions{ flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  .p-actions:empty{ display:none; }

  .ident{ display:flex; flex-direction:column; gap:11px; }
  .ident .top{ display:flex; align-items:center; gap:11px; }
  .avatar{ width:34px; height:34px; flex:0 0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; color:var(--ground); }
  .ident h2{ margin:0; font-size:21px; font-weight:600; letter-spacing:-.015em; line-height:1.15; text-wrap:balance; overflow-wrap:anywhere; }
  .kv{ display:flex; gap:8px; font-size:11px; }
  .kv b{ font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); min-width:52px; flex:0 0 auto; }
  .kv .val{ color:var(--dim); word-break:break-all; }
  .ident .kind{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; margin-top:3px; }
  .stats{ display:flex; gap:8px; }
  .tile{ flex:1 1 0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
  .tile .l{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .tile .v{ font-size:14px; font-weight:600; margin-top:2px; }

  .slabel{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); }
  .desc{ font-size:13.5px; line-height:1.65; color:var(--text); text-wrap:pretty; white-space:pre-wrap; overflow-wrap:anywhere; }
  .desc.clamp{ max-height:88px; overflow:hidden; }
  .reveal{ color:var(--accent); cursor:pointer; font-size:12.5px; margin-top:-8px; display:inline-block; }
  .section{ display:flex; flex-direction:column; gap:8px; }
  .section .hd{ display:flex; align-items:baseline; justify-content:space-between; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:99px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--text); }
  .chip:hover{ border-color:var(--accent); }
  .chip .cd{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .chip.out{ background:transparent; color:var(--dim); }

  .card{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; display:flex; flex-direction:column; gap:6px; }
  .card .name{ display:flex; align-items:center; gap:7px; font-size:13px; }
  .card .name .lnk{ cursor:pointer; }
  .card .name .lnk:hover{ color:var(--accent); }
  .wbar{ display:flex; align-items:center; gap:7px; }
  .wbar .track{ height:3px; background:var(--surface-3); border-radius:2px; overflow:hidden; }
  .wbar .fill{ height:100%; background:var(--accent); }
  .wbar .wv{ font-family:var(--mono); font-size:10px; color:var(--faint); }
  .quote{ font-size:12.5px; line-height:1.6; color:var(--dim); text-wrap:pretty; overflow-wrap:anywhere; }
  .src{ font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--faint); }
  .src-link{ cursor:pointer; } .src-link:hover{ color:var(--accent); }

  .ends{ display:flex; align-items:stretch; gap:8px; }
  .ecard{ flex:1 1 0; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer; }
  .ecard:hover{ border-color:var(--accent); }
  .ecard .en{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ecard .et{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-top:3px; }
  .ejoin{ flex:0 0 auto; display:flex; align-items:center; color:var(--dim); font-size:16px; }
  .kbadge{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); background:var(--surface-3); border-radius:5px; padding:3px 7px; }
  .rcard{ border-left:2px solid var(--line-2); background:var(--surface-2); border-radius:0 10px 10px 0; padding:9px 12px; display:flex; flex-direction:column; gap:5px; }
  .rcard.newest{ border-left-color:var(--accent); }

  .btn{ height:34px; padding:0 13px; border-radius:8px; font-size:12.5px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-2); background:var(--surface-3); color:var(--text); }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); color:var(--ground); border-color:var(--accent); font-weight:600; }
  .btn.ghost{ background:transparent; color:var(--dim); }
  .btn.right{ margin-left:auto; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .btn[disabled]:hover{ border-color:var(--line-2); }

  .idle h2{ margin:0 0 8px; font-size:17px; font-weight:600; }
  .idle p{ margin:0 0 14px; color:var(--dim); font-size:13px; line-height:1.6; }
  .keys{ display:flex; flex-direction:column; gap:7px; }
  .keyrow{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--dim); }
  .keycap{ font-family:var(--mono); font-size:10px; min-width:64px; text-align:center; padding:4px 6px; background:var(--surface-3); border:1px solid var(--line-2); border-radius:6px; color:var(--text); }
  .appears{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pill"><span class="dot"></span><span class="gname" id="gname"></span><span class="gcount" id="gcount"></span></div>
<div id="zcrumb"></div>
<div id="altrail"><div class="track"></div><div class="dot" id="altdot"></div></div>
<div id="tip"></div>
<div id="legend"></div>
<div id="minimap"><div class="mm-head"><span>OVERVIEW</span><span id="mmzoom">1.00×</span></div><canvas id="mmc" width="268" height="168"></canvas></div>
<div id="scenes"></div>
<div id="nowplaying"></div>
<div id="panel">
  <div class="p-head">
    <div class="sq" id="pback" title="back" style="display:none">‹</div>
    <div class="crumb" id="crumb"></div>
    <span class="badge" id="pbadge" style="display:none">deep inspect</span>
    <div class="sq" id="pclose" title="close">✕</div>
  </div>
  <div class="p-scroll" id="pscroll"></div>
  <div class="p-actions" id="pactions"></div>
</div>
<script>
const GRAPH = /*__GRAPH_DATA__*/ {nodes:[],edges:[]};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio||1, 2);
function resize(){ W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();
const $=id=>document.getElementById(id);

// Escape model/user-controlled strings before ANY innerHTML interpolation (a name like "<img onerror=…>"
// must not execute). textContent paths (title, body, tooltip, chips) need no escaping.
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- model (positions seeded on a ring, then settled) ---
// Seed positions are index-derived over the FULL node list (provenance included) — see design §3.2.
// `sx/sy` keep the seed so the fallback can restart from it; `x/y` may be replaced by stored layout below.
const nodes = GRAPH.nodes.map((n,i)=>({ ...n,
  sx: Math.cos(i)*220 + (i%7-3)*30, sy: Math.sin(i)*220 + (i%5-2)*30,
  x: Math.cos(i)*220 + (i%7-3)*30, y: Math.sin(i)*220 + (i%5-2)*30, vx:0, vy:0, deg:0 }));
const LAYOUT = GRAPH.layout || {};
// --- edge attention budget: rank edges by a chosen prominence measure and draw only the top slice.
// hebbian_weight is deliberately NOT an option: it is 1 on ~94% of real edges, so filtering by it is
// thresholding a constant. 'none' keeps every edge (what the viewer did before).
const PROM = GRAPH.prominence || {};
const PROM_MEASURES = Object.keys(PROM);
let edgeMeasure = PROM_MEASURES.includes('betweenness') ? 'betweenness'
                : (PROM_MEASURES[0] || 'none');
let edgeKeepPct = 100;   // show the top N% of edges by the chosen measure
let edgeCut = -Infinity; // recomputed whenever measure or percentage changes
const byId = new Map(nodes.map(n=>[n.id,n]));
const edges = GRAPH.edges.map(e=>({ ...e, a:byId.get(e.from), b:byId.get(e.to) })).filter(e=>e.a&&e.b);

// Provenance nodes (the document + its chunks) are PRESENT in the data but hidden by default — they're the
// RAG substrate, not the semantic map. Press 'h' to reveal them (and their APPEARED_IN/ORIGINATED_FROM edges).
const isProv = n => n.type==='SOURCE' && (n.group==='chunk' || n.group==='document');
let showProv = false;
let NODES=[], EDGES=[], maxDeg=1;
function rebuild(reposition){
  if(reposition===undefined) reposition=true;
  const vis = new Set(nodes.filter(n=>showProv||!isProv(n)));
  NODES = [...vis];
  EDGES = edges.filter(e=>vis.has(e.a)&&vis.has(e.b));
  // apply the attention budget: keep the top edgeKeepPct% by the selected measure
  if(edgeMeasure!=='none' && PROM[edgeMeasure] && edgeKeepPct<100){
    const tbl=PROM[edgeMeasure];
    const scored=EDGES.map(e=>tbl[e.id]??0).sort((a,b)=>b-a);
    const k=Math.max(1, Math.floor(scored.length*edgeKeepPct/100));
    edgeCut = scored[k-1] ?? -Infinity;
    EDGES = EDGES.filter(e=>(tbl[e.id]??0) >= edgeCut);
  } else { edgeCut = -Infinity; }
  // Visual weight: rank the surviving edges 0..1 so thickness/opacity can carry prominence. Percentile
  // rather than raw value because betweenness spans four orders of magnitude — on a linear scale all but a
  // handful of edges would render invisible. Computed AFTER filtering, so contrast is relative to what is
  // actually on screen.
  if(edgeMeasure!=='none' && PROM[edgeMeasure]){
    const ptbl=PROM[edgeMeasure];
    const order=EDGES.map(e=>({e, v:ptbl[e.id]??0})).sort((p,q)=>p.v-q.v);
    const last=Math.max(1, order.length-1);
    // AVERAGE ranks across ties. Betweenness produces mass ties (every edge on no shortest path scores
    // exactly 0), and strict ranking would spread them across a whole range of widths and opacities —
    // rendering differences that do not exist, ordered by nothing but array position.
    let i=0;
    while(i<order.length){
      let j=i; while(j+1<order.length && order[j+1].v===order[i].v) j++;
      const shared=((i+j)/2)/last;
      for(let k=i;k<=j;k++) order[k].e.prom = shared;
      i=j+1;
    }
  } else { for(const e of EDGES) e.prom = 0.5; }
  for(const n of NODES) n.deg=0;
  for(const e of EDGES){ e.a.deg++; e.b.deg++; }   // degree over VISIBLE edges → size = semantic connectivity
  maxDeg = Math.max(1, ...NODES.map(n=>n.deg));
  // --- design §3.4: ALL-OR-NOTHING. One decision over the whole visible set, never per node.
  // complete   -> use every stored position and never settle (the map you learned stays put)
  // incomplete -> ignore stored layout ENTIRELY, restart from the seeds, and run the full settle.
  // Mixing is forbidden: settle() does not re-seed (it zeroes velocities only), so a stored/seeded hybrid
  // would move anchored nodes along a trajectory that depends on which rows happened to exist.
  // `reposition` is false when only the EDGE BUDGET changed. A draw filter must never move nodes: settle()
  // pulls along EDGES, so re-settling per slider tick would make the geometry depend on the slider position
  // — and in the fallback path that is a full settle, measured at 36.6s on the 10x graph, per tick.
  const complete = NODES.length>0 && NODES.every(n=>LAYOUT[n.id]);
  if(reposition){
    if(complete){ for(const n of NODES){ const p=LAYOUT[n.id]; n.x=p[0]; n.y=p[1]; n.vx=0; n.vy=0; } }
    else { for(const n of NODES){ n.x=n.sx; n.y=n.sy; n.vx=0; n.vy=0; } settle(); }
  }
  computeBounds(); renderMMDots(); buildLegend(); updateCounts();
}
function updateCounts(){
  $('gname').textContent = GRAPH.name || 'graph';
  $('gcount').textContent = NODES.length+' nodes · '+EDGES.length+' edges'+(showProv?' · +prov':'');
}

// --- colour: coarse buckets, deliberately few. Person vs. the rest, because 7 shades of one hue don't read.
// Add a bucket to `bucket()` when a group EARNS its own colour (place is the obvious next candidate). ---
const NODE_COLORS = { person:'#e0af68', place:'#9ece6a', org:'#7dcfff', other:'#7f8aa3' };
function bucket(n){ return n.type==='PERSON' ? 'person' : 'other'; } // e.g. add: n.group==='place'?'place':…
function colorFor(n){ return NODE_COLORS[bucket(n)] || NODE_COLORS.other; }
function radius(n){ const base = n.type==='PERSON' ? 5 : 4; return base + 10*Math.sqrt(n.deg/maxDeg); }

function buildLegend(){
  const label = { person:'person', place:'place', org:'organization', other:'everything else' };
  const order = ['person','place','org','other'];
  const present = [...new Set(NODES.map(bucket))].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  const hasReson = EDGES.some(e=>e.kind==='RESONATES_WITH');
  $('legend').innerHTML = present.map(g=>'<div class="row"><span class="dot" style="background:'+NODE_COLORS[g]+'"></span>'+esc(label[g]||g)+'</div>').join('')
    + (hasReson ? '<div class="row" style="margin-top:6px"><span class="ln" style="border-color:#f7768e"></span>resonates with</div>' : '');
}

// --- force layout: settle ONCE (here / on toggle), then FREEZE. Moving nodes only induced churn, so the
// layout is static after this — pan & zoom move the camera, not the graph. ---
function settle(){
  const kRep=5200, kSpring=0.045, rest=90, grav=0.012;
  for(const n of NODES){ n.vx=0; n.vy=0; }
  for(let it=0; it<500; it++){
    const alpha = Math.max(0.03, Math.pow(0.992, it));
    for(let i=0;i<NODES.length;i++){ const a=NODES[i];
      for(let j=i+1;j<NODES.length;j++){ const b=NODES[j];
        let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2);
        const f=kRep/d2, fx=f*dx/d, fy=f*dy/d; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy; }
      a.vx-=a.x*grav; a.vy-=a.y*grav;
    }
    for(const e of EDGES){ let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, d=Math.hypot(dx,dy)||0.01;
      const f=kSpring*(d-rest), fx=f*dx/d, fy=f*dy/d; e.a.vx+=fx; e.a.vy+=fy; e.b.vx-=fx; e.b.vy-=fy; }
    for(const n of NODES){ n.x+=n.vx*alpha; n.y+=n.vy*alpha; n.vx*=0.82; n.vy*=0.82; }
  }
}

// --- camera ---
let scale=1, ox=W/2, oy=H/2;
let camAnim=null; // scene fly-to tween (ease-out; cancelled by any manual pan/zoom)
function flyTo(tox,toy,ts,dur){ camAnim={ t0:performance.now(), dur:dur||460, fox:ox, foy:oy, fs:scale, tox, toy, ts }; } // 460 = snappy click-to-scene; tours pass a longer, cinematic glide
function toScreen(x,y){ return [x*scale+ox, y*scale+oy]; }
function toWorld(px,py){ return [(px-ox)/scale, (py-oy)/scale]; }

// --- interaction state (no node dragging) ---
let hoverNode=null, hoverEdge=null, selected=null, panning=false, lastX=0, lastY=0, downX=0, downY=0;

// --- semantic zoom: typography as altitude. The tier (from camera zoom) sets which nodes label AND how the type
// reads — tracking is the altimeter (shrinks as you descend), family marks the register (serif=land, sans=
// settlement, mono=evidence), ink contrast rises as you go lower. Continent cluster-labels are DEFERRED (no
// clustering pass yet), so the ladder starts at country with landmark punch-through (the prominence budget).
const FF={serif:'Georgia,ui-serif,serif', sans:'-apple-system,system-ui,sans-serif', mono:'ui-monospace,Menlo,monospace'};
// `budget` = the prominence budget: how many labels the altitude affords. Small at the top (a few landmarks
// stand in for the deferred community NAMES), growing as you descend — so a lone hub doesn't flood the serif.
const TIERS=[
  {name:'continent', zmax:0.8, deg:22, budget:4,  w:'300', size:27, fam:FF.serif, track:0.30, caps:1, ink:'rgba(230,233,239,.55)', sub:'clusters (soon)'},
  {name:'country',   zmax:1.4, deg:14, budget:9,  w:'400', size:21, fam:FF.serif, track:0.18, caps:1, ink:'rgba(230,233,239,.85)', sub:'landmarks'},
  {name:'region',    zmax:2.4, deg:10, budget:24, w:'600', size:15, fam:FF.sans,  track:0.13, caps:1, ink:'#b9c0d0', sub:'major hubs'},
  {name:'city',      zmax:4.0, deg:7,  budget:48, w:'600', size:15, fam:FF.sans,  track:-0.01, title:1, ink:'#e6e9ef', sub:'hubs + type'},
  {name:'district',  zmax:6.5, deg:2,  budget:90, w:'500', size:13, fam:FF.sans,  track:0, ink:'#cfd5e4', sub:'most nodes'},
  {name:'building',  zmax:99,  deg:1,  budget:90, w:'400', size:12, fam:FF.mono,  track:0.02, ink:'#9aa3b8', sub:'reasons'},
];
function tierFor(s){ for(const t of TIERS) if(s<=t.zmax) return t; return TIERS[TIERS.length-1]; }
const titleCase=s=>String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
(function(){ const rail=$('altrail'); TIERS.forEach((t,i)=>{ const r=document.createElement('div'); r.className='r'; r.id='alt'+i;
  const nm=document.createElement('span'); nm.textContent=t.name; nm.style.cssText='font-family:'+t.fam+';font-size:11px;color:'+t.ink;
  const sb=document.createElement('span'); sb.className='sb'; sb.textContent=t.sub; r.appendChild(nm); r.appendChild(sb); rail.appendChild(r); }); })();
let lastTi=-1;
function updateChrome(ti){ for(let i=0;i<TIERS.length;i++) $('alt'+i).classList.toggle('on', i===ti);
  const rows=$('altrail').querySelectorAll('.r'); if(rows[ti]) $('altdot').style.top=(rows[ti].offsetTop+rows[ti].offsetHeight/2-4)+'px';
  $('zcrumb').textContent = TIERS.slice(0, ti+1).map(t=>t.name).join('  ›  ');
}

// --- minimap: whole graph small, with a live viewport box (click to jump, drag to pan) ---
let bounds={minX:-300,maxX:300,minY:-300,maxY:300};
function computeBounds(){ if(!NODES.length) return; let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const n of NODES){ if(n.x<a)a=n.x; if(n.x>b)b=n.x; if(n.y<c)c=n.y; if(n.y>d)d=n.y; }
  const px=(b-a)*0.06+20, py=(d-c)*0.06+20; bounds={minX:a-px,maxX:b+px,minY:c-py,maxY:d+py}; }
const mmc=$('mmc'), mmx=mmc.getContext('2d'), MMW=268, MMH=168;
const mmDots=document.createElement('canvas'); mmDots.width=MMW; mmDots.height=MMH; const mmdx=mmDots.getContext('2d');
function mmS(){ return Math.min(MMW/(bounds.maxX-bounds.minX), MMH/(bounds.maxY-bounds.minY)); }
function toMM(x,y){ const s=mmS(); return [ (x-bounds.minX)*s + (MMW-(bounds.maxX-bounds.minX)*s)/2, (y-bounds.minY)*s + (MMH-(bounds.maxY-bounds.minY)*s)/2 ]; }
function mmToWorld(px,py){ const s=mmS(); return [ (px-(MMW-(bounds.maxX-bounds.minX)*s)/2)/s+bounds.minX, (py-(MMH-(bounds.maxY-bounds.minY)*s)/2)/s+bounds.minY ]; }
function renderMMDots(){ mmdx.clearRect(0,0,MMW,MMH);  // node dots are static between rebuilds → cache offscreen
  for(const n of NODES){ const [x,y]=toMM(n.x,n.y); mmdx.fillStyle=colorFor(n); mmdx.globalAlpha=.8; mmdx.beginPath(); mmdx.arc(x,y,n.deg>=10?2:1.2,0,7); mmdx.fill(); }
  mmdx.globalAlpha=1; }
let lastZ='';
function drawMinimap(){ mmx.clearRect(0,0,MMW,MMH); mmx.drawImage(mmDots,0,0);
  const [wx0,wy0]=toWorld(0,0), [wx1,wy1]=toWorld(W,H); const [mx0,my0]=toMM(wx0,wy0), [mx1,my1]=toMM(wx1,wy1);
  mmx.fillStyle='rgba(122,162,247,.09)'; mmx.fillRect(mx0,my0,mx1-mx0,my1-my0);
  mmx.strokeStyle='#7aa2f7'; mmx.lineWidth=1.5; mmx.strokeRect(mx0,my0,mx1-mx0,my1-my0);
  const z=scale.toFixed(2)+'×'; if(z!==lastZ){ $('mmzoom').textContent=z; lastZ=z; }
}
let mmDrag=false;
function mmJump(ev){ const r=mmc.getBoundingClientRect(); const [wx,wy]=mmToWorld(ev.clientX-r.left, ev.clientY-r.top); ox=W/2-wx*scale; oy=H/2-wy*scale; }
mmc.addEventListener('mousedown', ev=>{ if(ev.button!==0) return; mmDrag=true; mmJump(ev); ev.stopPropagation(); });
mmc.addEventListener('contextmenu', ev=> ev.preventDefault()); // right-click on the minimap shouldn't jump + menu
addEventListener('mousemove', ev=>{ if(mmDrag) mmJump(ev); });
addEventListener('mouseup', ()=>{ mmDrag=false; });
addEventListener('blur', ()=>{ mmDrag=false; panning=false; }); // release if the mouseup landed off-window

function draw(){
  ctx.clearRect(0,0,W,H);
  if(camAnim){ const k=Math.min(1,(performance.now()-camAnim.t0)/camAnim.dur), e=1-Math.pow(1-k,3); // ease-out cubic
    ox=camAnim.fox+(camAnim.tox-camAnim.fox)*e; oy=camAnim.foy+(camAnim.toy-camAnim.foy)*e; scale=camAnim.fs+(camAnim.ts-camAnim.fs)*e;
    if(k>=1) camAnim=null; }
  const tier=tierFor(scale), ti=TIERS.indexOf(tier);
  if(ti>=3){ // city and lower: a faint aligned grid that scales with zoom (a floor to read motion against)
    const step=96*scale, a=Math.min(0.055, 0.02+(ti-3)*0.018);
    ctx.strokeStyle='rgba(139,147,167,'+a+')'; ctx.lineWidth=1;
    const x0=((ox%step)+step)%step, y0=((oy%step)+step)%step; ctx.beginPath();
    for(let x=x0;x<W;x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for(let y=y0;y<H;y+=step){ ctx.moveTo(0,y); ctx.lineTo(W,y); } ctx.stroke();
  }
  const focusSet = selected ? new Set([selected.id, ...EDGES.filter(e=>e.a===selected||e.b===selected).flatMap(e=>[e.a.id,e.b.id])]) : null;
  // Interim edge treatment: fade + thin when zoomed OUT (edges overlap into a hairball at moderate zoom), firm
  // up as you zoom in. The richer language (rank/weight/kind, bundling) is going to Claude Design.
  const edgeAlpha = Math.max(0.045, Math.min(0.30, 0.16*scale));
  for(const e of EDGES){
    const [ax,ay]=toScreen(e.a.x,e.a.y), [bx,by]=toScreen(e.b.x,e.b.y);
    const on = e===hoverEdge || (focusSet && (e.a===selected||e.b===selected));
    const reson = e.kind==='RESONATES_WITH';
    // Prominence drives BOTH width and opacity — the attention budget made visible, not merely filterable.
    const p = (e.prom===undefined ? 0.5 : e.prom);
    const pa = edgeAlpha * (0.35 + 1.30*p);
    // Prominence survives BOTH selection states. Before, focusing a node flattened everything: the focused
    // edges all went white at width 2, and the dimmed background all went one flat colour — so the moment
    // you selected a node to look closely, the encoding you were reading vanished. A focused edge is where
    // you most want to know which links carry weight.
    ctx.strokeStyle = on ? 'rgba(255,255,255,'+(0.55+0.45*p).toFixed(3)+')'
      : (focusSet ? (reson ? 'rgba(58,42,68,'+(0.45+0.55*p).toFixed(3)+')' : 'rgba(26,33,48,'+(0.45+0.55*p).toFixed(3)+')')
      : (reson ? 'rgba(247,118,142,'+Math.min(0.5,pa*1.6)+')' : 'rgba(120,140,180,'+Math.min(0.6,pa)+')'));
    ctx.lineWidth = on ? (1.10 + 1.70*p) : (reson ? 1.1 : (0.35 + 1.45*p));
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  for(const n of NODES){
    const [x,y]=toScreen(n.x,n.y), rr=radius(n);
    const dim = focusSet && !focusSet.has(n.id);
    const col = colorFor(n);
    ctx.globalAlpha = dim ? 0.18 : 1;
    const g=ctx.createRadialGradient(x,y,0,x,y,rr*2.4);        // soft glow halo
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rr*2.4,0,7); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill();   // core
    if(n===selected||n===hoverNode){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
  // labels by tier: which nodes label (degree budget for the altitude) + how the type reads. Landmarks
  // (hover/selected/focus) always label; viewport-culled + capped so a low altitude doesn't flood.
  // Type encodes PROMINENCE, not just camera altitude. A node that BELONGS at this tier (deg ≥ threshold) gets
  // the tier's grand type; a punch-through node you merely selected/hovered that does NOT belong (a minor node)
  // gets a muted focus style — so clicking a town at country zoom doesn't render it as a country. (Real cure for
  // "one name for the group" at altitude is the deferred community labels; this keeps the metaphor honest meanwhile.)
  const FOCUS={size:12.5, w:'500', fam:FF.sans, track:0, ink:'#dfe4ee'};
  ctx.textAlign='center'; ctx.textBaseline='top';
  const always=n=> n===hoverNode||n===selected||(focusSet&&focusSet.has(n.id));
  const vis0=NODES.filter(n=> !(focusSet&&!focusSet.has(n.id)))
    .map(n=>{ const [x,y]=toScreen(n.x,n.y); return {n,x,y}; })
    .filter(o=> o.x>-60&&o.x<W+60&&o.y>-30&&o.y<H+30);
  const keep=vis0.filter(o=> always(o.n));  // hover/selection/focus labels — drawn additively, on TOP of the tier set
  // The tier's landmark set is STABLE, sized by the budget alone — a transient hover/selection label must NOT
  // steal a slot, or hovering a node in one corner makes a landmark pop in/out elsewhere on the map (the map
  // must not reshuffle when you interact locally). So slice to the full budget, not budget-minus-keep.
  const rest=vis0.filter(o=> !always(o.n) && o.n.deg>=tier.deg).sort((a,b)=> b.n.deg-a.n.deg).slice(0, tier.budget);
  for(const {n,x,y} of keep.concat(rest)){
    const T = (n.deg>=tier.deg) ? tier : FOCUS;   // belongs here → tier type; punch-through minor → muted focus
    ctx.font=T.w+' '+T.size+'px '+T.fam;
    try{ ctx.letterSpacing=((T.track||0)*T.size).toFixed(1)+'px'; }catch(e){}
    let t=(n.label||''); if(T.caps) t=t.toUpperCase(); else if(T.title) t=titleCase(t); if(t.length>44) t=t.slice(0,43)+'…';
    const by=y+radius(n)+4, w=ctx.measureText(t).width;
    ctx.fillStyle='rgba(10,12,17,0.66)'; ctx.fillRect(x-w/2-4, by, w+8, T.size+4);
    ctx.fillStyle=T.ink; ctx.fillText(t, x, by+2);
  }
  try{ ctx.letterSpacing='0px'; }catch(e){} ctx.textBaseline='alphabetic';
  drawMinimap();
  if(ti!==lastTi){ updateChrome(ti); lastTi=ti; }
  requestAnimationFrame(draw);
}

// --- hit testing (visible nodes/edges only) ---
function nodeAt(px,py){ let best=null,bd=1e9;
  for(const n of NODES){ const [x,y]=toScreen(n.x,n.y); const d=Math.hypot(px-x,py-y); if(d<radius(n)+6 && d<bd){bd=d;best=n;} }
  return best; }
function edgeAt(px,py){ let best=null,bd=7;
  for(const e of EDGES){ const [ax,ay]=toScreen(e.a.x,e.a.y),[bx,by]=toScreen(e.b.x,e.b.y);
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1; let t=((px-ax)*dx+(py-ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const cx=ax+t*dx, cy=ay+t*dy, d=Math.hypot(px-cx,py-cy); if(d<bd){bd=d;best=e;} }
  return best; }

const tip=$('tip');
cv.addEventListener('mousemove', ev=>{
  const px=ev.clientX, py=ev.clientY;
  if(mmDrag){ tip.style.display='none'; hoverNode=hoverEdge=null; return; } // don't hover-flicker while dragging the minimap
  if(panning){ ox+=px-lastX; oy+=py-lastY; lastX=px; lastY=py; return; }
  hoverNode=nodeAt(px,py); hoverEdge=hoverNode?null:edgeAt(px,py);
  if(hoverEdge){ tip.style.display='block'; tip.style.left=(px+12)+'px'; tip.style.top=(py+12)+'px';
    // the reason IS the insight — don't prefix "A ↔ B" (formulaic; the endpoints are already the two nodes it
    // joins). A mono kind+weight line sits above it. Fall back to endpoint names only when there's no reason.
    tip.innerHTML = '<span class="k">'+esc(hoverEdge.kind)+' · w '+(+hoverEdge.w||1)+'</span>'
      + esc(hoverEdge.reason || ((hoverEdge.a.label||'')+'  —  '+(hoverEdge.b.label||''))); }
  else if(hoverNode){ tip.style.display='block'; tip.style.left=(px+12)+'px'; tip.style.top=(py+12)+'px'; tip.textContent=hoverNode.label; }
  else tip.style.display='none';
  cv.style.cursor=(hoverNode||hoverEdge)?'pointer':'grab';
});
cv.addEventListener('mousedown', ev=>{ if(ev.button!==0) return; camAnim=null; panning=true; cv.classList.add('dragging'); lastX=downX=ev.clientX; lastY=downY=ev.clientY; });
addEventListener('mouseup', ev=>{ if(ev.button!==0) return;
  const moved = Math.hypot(ev.clientX-downX, ev.clientY-downY) >= 4; // click vs. drag
  if(panning && !moved){ const n=nodeAt(ev.clientX,ev.clientY); if(n){ walk=[]; openNode(n,false); } else { const e=edgeAt(ev.clientX,ev.clientY); e?openEdge(e):showIdle(); } }
  panning=false; cv.classList.remove('dragging'); });
// right-click = deep inspect (node or edge)
cv.addEventListener('contextmenu', ev=>{ ev.preventDefault(); const n=nodeAt(ev.clientX,ev.clientY);
  if(n){ walk=[]; openNode(n,true); return; } const e=edgeAt(ev.clientX,ev.clientY); if(e) openEdge(e); });
cv.addEventListener('wheel', ev=>{ ev.preventDefault(); camAnim=null; const [wx,wy]=toWorld(ev.clientX,ev.clientY);
  scale*=ev.deltaY<0?1.1:0.9; scale=Math.max(0.12,Math.min(8,scale)); ox=ev.clientX-wx*scale; oy=ev.clientY-wy*scale; }, {passive:false});

// --- panel: idle / node focus (left-click) / node deep (right-click) / edge — one component, breadcrumb walk ---
const panel=$('panel'), pscroll=$('pscroll'), pactions=$('pactions'), crumb=$('crumb');
let walk=[]; // breadcrumb of visited node ids
let curEdge=null; // the edge shown in the panel, if any (selected tracks a node instead)
const trunc=(s,n)=>{ s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s; };

const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
function clearPanel(){ pscroll.innerHTML=''; pactions.innerHTML=''; }
function neighborsOf(n){ return EDGES.filter(e=>(e.a===n||e.b===n) && e.a!==e.b).map(e=>({ node:e.a===n?e.b:e.a,
  reason:e.reason, reasons:(e.reasons&&e.reasons.length)?e.reasons:(e.reason?[e.reason]:[]), kind:e.kind, w:+e.w||1 })); }
function provChunks(n){ return edges.filter(e=>e.a===n && e.kind==='APPEARED_IN').map(e=>e.b.label||'').filter(Boolean); }
function sourcesOf(n){ return [...new Set(provChunks(n).map(l=>{ const m=l.match(/^chunk \d+ of (.+)$/); return m?m[1]:l; }))]; }
const initialOf=s=>((String(s||'?').trim()[0])||'?').toUpperCase();
function centerOn(n){ ox=W/2-n.x*scale; oy=H/2-n.y*scale; }

function setCrumb(n){ crumb.innerHTML='';
  const prev = walk.length>1 ? byId.get(walk[walk.length-2]) : null;
  if(prev){ crumb.appendChild(el('span',null,prev.label||prev.id)); crumb.appendChild(el('span',null,'  ›  ')); }
  crumb.appendChild(el('b',null, n?(n.label||n.id):''));
  $('pback').style.display = walk.length>1 ? 'flex' : 'none';
}
function tile(l,v){ const t=el('div','tile'); t.appendChild(el('div','l',l)); t.appendChild(el('div','v',String(v))); return t; }
function chipEl(node){ const c=el('span','chip'); const d=el('span','cd'); d.style.background=colorFor(node);
  c.appendChild(d); c.appendChild(el('span',null,node.label||node.id)); c.onclick=()=>walkTo(node); return c; }
function mkBtn(label,cls,onclick){ const b=el('button','btn'+(cls?' '+cls:''),label); if(onclick) b.onclick=onclick; else b.disabled=true; return b; }
function walkTo(node){ if(!NODES.includes(node)) return; walk.push(node.id); openNode(node, panel.classList.contains('deep')); centerOn(node); } // don't walk to a hidden (provenance) node
// backlink into provenance: reveal the chunk layer if needed, then open the source chunk (its raw text is the description)
function revealAndGo(node){ if(!NODES.includes(node)){ showProv=true; rebuild(); } walk.push(node.id); openNode(node,false); centerOn(node); } // keep breadcrumb → back returns to the entity

function openNode(n, deep){
  selected=n; curEdge=null; panel.classList.add('open'); panel.classList.toggle('deep',!!deep); panel.classList.remove('edge');
  $('pbadge').style.display = deep?'inline-block':'none';
  if(!walk.length || walk[walk.length-1]!==n.id) walk.push(n.id);
  setCrumb(n); clearPanel();

  const ident=el('div','ident'), top=el('div','top');
  const av=el('div','avatar', initialOf(n.label)); av.style.background=colorFor(n); top.appendChild(av);
  const tt=el('div'); tt.appendChild(el('h2',null,n.label||n.id));
  // don't render "PERSON / PERSON" (the Personperson) — collapse type/subtype when they're the same word.
  const kindText = (n.group && n.group.toLowerCase()!==n.type.toLowerCase()) ? (n.type+' / '+n.group) : n.type;
  const kind=el('div','kind', kindText); kind.style.color=colorFor(n); tt.appendChild(kind);
  top.appendChild(tt); ident.appendChild(top);
  const st=el('div','stats'); st.appendChild(tile('strength','×'+n.strength)); st.appendChild(tile('degree',n.deg)); st.appendChild(tile('sources',sourcesOf(n).length)); ident.appendChild(st);
  pscroll.appendChild(ident);

  const md=n.meta||{}, descText=md.description||md.bio||n.text||'';
  if(descText){ const d=el('div','desc'+(deep?'':' clamp'),descText); pscroll.appendChild(d);
    // reveal only when the clamp actually clips (pixel-based, not char-count) — CJK/wide glyphs clip under 170 chars too.
    if(!deep) requestAnimationFrame(()=>{ if(d.scrollHeight>d.clientHeight+2){ const r=el('span','reveal','Show full description'); r.onclick=()=>{ d.classList.remove('clamp'); r.remove(); }; d.after(r); } }); }

  // deep inspect exposes the raw identity (id + the dedup identity string) — hidden in focus mode.
  if(deep){ const idbox=el('div','section');
    [['id',n.id],['identity',n.text]].filter(r=>r[1]!=null).forEach(([k,v])=>{ const row=el('div','kv'); row.appendChild(el('b',null,k)); row.appendChild(el('span','val',String(v))); idbox.appendChild(row); });
    pscroll.appendChild(idbox); }

  // Connections = ALL non-provenance edge kinds (RELATED, RESONATES_WITH, REFERENCES, …), grouped by kind — the
  // degree tile counts these, so the panel must not silently drop a kind (provenance has its own section below).
  // a chunk shows the entities extracted FROM it (reverse APPEARED_IN); a normal node shows its semantic links.
  const isChunk = n.group==='chunk';
  const links=neighborsOf(n).filter(x=> isChunk ? x.kind==='APPEARED_IN' : (x.kind!=='APPEARED_IN' && x.kind!=='ORIGINATED_FROM'));
  const sec=el('div','section'), hd=el('div','hd');
  hd.appendChild(el('div','slabel', isChunk?'Extracted here':'Connections'));
  hd.appendChild(el('div','slabel', isChunk ? links.length+' entit'+(links.length===1?'y':'ies') : links.length+' link'+(links.length===1?'':'s'))); sec.appendChild(hd);
  if(!links.length){ sec.appendChild(el('div','quote', isChunk?'No entities extracted here.':'No semantic links yet.')); }
  else {
    const kinds={}; links.forEach(x=>{ (kinds[x.kind]=kinds[x.kind]||[]).push(x); });
    const multi=Object.keys(kinds).length>1;
    Object.keys(kinds).forEach(k=>{
      if(multi || k!=='RELATED') sec.appendChild(el('span','kbadge',k)); // label the kind when it carries info
      if(deep){
        kinds[k].forEach(({node,reasons,w})=>{ const c=el('div','card'), nm=el('div','name');
          const dot=el('span','cd'); dot.style.background=colorFor(node); nm.appendChild(dot);
          const lnk=el('span','lnk',node.label||node.id); lnk.onclick=()=>walkTo(node); nm.appendChild(lnk); c.appendChild(nm);
          const wb=el('div','wbar'), tr=el('div','track'); tr.style.width='34px'; const fl=el('div','fill'); fl.style.width=Math.max(6,Math.min(100,(w/4)*100))+'%'; tr.appendChild(fl); wb.appendChild(tr); wb.appendChild(el('span','wv','w '+w)); c.appendChild(wb);
          reasons.forEach(rr=>c.appendChild(el('div','quote',rr))); sec.appendChild(c); });
      } else {
        const chips=el('div','chips'), list=kinds[k], cap=14;
        list.slice(0,cap).forEach(({node})=>chips.appendChild(chipEl(node)));
        if(list.length>cap){ const more=el('span','chip out','+'+(list.length-cap)+' more'); more.onclick=()=>{ more.remove(); list.slice(cap).forEach(({node})=>chips.appendChild(chipEl(node))); }; chips.appendChild(more); }
        sec.appendChild(chips);
      }
    });
  }
  pscroll.appendChild(sec);

  // provenance: in deep mode the chunk rows are BACKLINKS — click to open the source chunk (its raw text). In
  // focus mode, the distinct source documents (not clickable — the chunk layer stays hidden).
  const provN = edges.filter(e=>e.a===n && e.kind==='APPEARED_IN').map(e=>e.b);
  if(provN.length){ const ap=el('div','section'); ap.appendChild(el('div','slabel', deep?'Provenance — click to open the chunk':'Appears in — click to open the profile'));
    const card=el('div','appears');
    if(deep){ provN.forEach(cn=>{ const row=el('div','src src-link', cn.label||cn.id); row.onclick=()=>revealAndGo(cn); card.appendChild(row); }); }
    // focus mode: the source titles are clickable → walk to the PARENT profile (the persona PERSON node) or the
    // SOURCE document node. This is the ONLY way off an orphan (a node with 0 semantic links, e.g. "Fertilizer Ratios").
    // viewer nodes expose `label` + `group` (NOT name/subtype — those live in the store); match on those.
    else { sourcesOf(n).forEach(title=>{ const target=nodes.find(x=>x.type==='PERSON'&&x.label===title)||nodes.find(x=>x.group==='document'&&x.label===title);
      const row=el('div','src'+(target?' src-link':''), title); if(target) row.onclick=()=>revealAndGo(target); card.appendChild(row); }); }
    ap.appendChild(card); pscroll.appendChild(ap); }

  pactions.appendChild(mkBtn('Center on map','primary',()=>centerOn(n)));
  pactions.appendChild(mkBtn('Save as scene',null,()=>saveScene(n.label))); // saves the current view, named for this node
  pactions.appendChild(deep ? mkBtn('Collapse','ghost right',()=>openNode(n,false)) : mkBtn('Deep inspect →','ghost right',()=>openNode(n,true)));
}

function openEdge(e){
  selected=null; curEdge=e; panel.classList.add('open','edge'); panel.classList.remove('deep'); $('pbadge').style.display='none';
  walk=[]; crumb.innerHTML=''; crumb.appendChild(el('b',null,'edge')); $('pback').style.display='none'; clearPanel();

  const ends=el('div','ends');
  const mkEnd=node=>{ const c=el('div','ecard'); c.appendChild(el('div','en',node.label||node.id)); c.appendChild(el('div','et',node.group||node.type)); c.onclick=()=>walkTo(node); return c; };
  ends.appendChild(mkEnd(e.a)); ends.appendChild(el('div','ejoin','↔')); ends.appendChild(mkEnd(e.b));
  pscroll.appendChild(ends);

  const reasons=(e.reasons&&e.reasons.length)?e.reasons:(e.reason?[e.reason]:[]);
  const meta=el('div'); meta.style.cssText='display:flex;align-items:center;gap:10px';
  meta.appendChild(el('span','kbadge',e.kind));
  const wb=el('div','wbar'); wb.appendChild(el('span','wv','weight')); const tr=el('div','track'); tr.style.width='56px'; const fl=el('div','fill'); fl.style.width=Math.max(6,Math.min(100,((e.w||1)/4)*100))+'%'; tr.appendChild(fl); wb.appendChild(tr); wb.appendChild(el('span','wv',String(e.w||1))); meta.appendChild(wb);
  const cnt=el('span','src',reasons.length+' reason'+(reasons.length===1?'':'s')); cnt.style.marginLeft='auto'; meta.appendChild(cnt);
  pscroll.appendChild(meta);

  const rsec=el('div','section'); rsec.appendChild(el('div','slabel','Reasons recorded'));
  const ordered=[...reasons].reverse(), showN=ordered.slice(0,3); // newest first (assertions stored oldest→newest)
  showN.forEach((rr,i)=>{ const c=el('div','rcard'+(i===0?' newest':'')); c.appendChild(el('div','quote',rr)); rsec.appendChild(c); });
  if(ordered.length>showN.length) rsec.appendChild(el('div','src','+'+(ordered.length-showN.length)+' more'));
  if(!ordered.length) rsec.appendChild(el('div','quote','(no reason recorded)'));
  pscroll.appendChild(rsec);

  pactions.appendChild(mkBtn('Walk to '+trunc(e.a.label||'A',16),null,()=>walkTo(e.a)));
  pactions.appendChild(mkBtn('Walk to '+trunc(e.b.label||'B',16),'ghost',()=>walkTo(e.b)));
}

function showIdle(){
  selected=null; curEdge=null; panel.classList.add('open'); panel.classList.remove('deep','edge'); $('pbadge').style.display='none';
  walk=[]; crumb.innerHTML=''; $('pback').style.display='none'; clearPanel();
  const box=el('div','idle');
  box.appendChild(el('h2',null,'Click a landmark to open it'));
  box.appendChild(el('p',null,'Left-click a node to focus its neighborhood; right-click to inspect it in full; hover an edge to see why it exists.'));
  const keys=el('div','keys');
  [['click','focus a node + its links'],['right-click','deep inspect a node or edge'],['hover','read an edge’s reason'],['h','show / hide provenance']].forEach(([k,d])=>{ const r=el('div','keyrow'); r.appendChild(el('span','keycap',k)); r.appendChild(el('span',null,d)); keys.appendChild(r); });
  box.appendChild(keys); pscroll.appendChild(box);
}

function back(){ if(walk.length>1){ walk.pop(); const prev=byId.get(walk[walk.length-1]); if(prev) openNode(prev, panel.classList.contains('deep')); } }
// re-render whatever the panel is showing after the graph changed (h toggle) — and fall back to idle if its
// subject vanished (an edge whose endpoint got hidden, a node that's no longer visible).
function rerender(){ if(selected){ NODES.includes(selected)?openNode(selected,panel.classList.contains('deep')):showIdle(); }
  else if(curEdge){ (NODES.includes(curEdge.a)&&NODES.includes(curEdge.b))?openEdge(curEdge):showIdle(); } }
// ✕ / esc steps back: a selection → idle, and idle → fully hidden (so you can see the whole graph on a narrow window).
function deselect(){ if(selected||curEdge) showIdle(); else if(panel.classList.contains('open')) panel.classList.remove('open'); }
$('pback').onclick=back; $('pclose').onclick=deselect;
addEventListener('keydown', e=>{
  if(e.target && (e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')){ if(e.key==='Escape') e.target.blur(); return; } // don't hijack typing
  if(tour){ if(e.key==='Escape') exitTour(); else if(e.key==='ArrowRight') tourStep(1); else if(e.key==='ArrowLeft') tourStep(-1); else if(e.key===' '){ e.preventDefault(); tourToggle(); } return; } // ←/→ step · space pause · esc exit
  if(e.key==='Escape') deselect(); else if(e.key==='h'||e.key==='H'){ showProv=!showProv; rebuild(); rerender(); } });

// --- scenes: save the current view (camera + provenance filter + selected node) and fly back to it later.
// Persisted per-graph in localStorage — the exported viewer is offline HTML, so that's the natural sidecar. ---
const SKEY='tessera-scenes-'+(GRAPH.name||'graph');
let scenes=[], activeScene=null;
function loadScenes(){ try{ scenes=JSON.parse(localStorage.getItem(SKEY))||[]; }catch(e){ scenes=[]; } }
function persistScenes(){ try{ localStorage.setItem(SKEY, JSON.stringify(scenes)); }catch(e){} }
function saveScene(name){ name=(name||'').trim(); if(!name){ renderScenes(); return; }
  const s={ id:'sc'+performance.now().toFixed(0), name, ox, oy, scale, showProv, node: selected?selected.id:null };
  scenes.push(s); activeScene=s.id; persistScenes(); renderScenes(); }
function restoreScene(s,dur){ activeScene=s.id;
  if(!!s.showProv!==showProv){ showProv=!!s.showProv; rebuild(); }   // match the saved provenance filter
  if(s.node){ const n=byId.get(s.node); if(n&&NODES.includes(n)){ walk=[]; openNode(n,false); } else showIdle(); } else showIdle();
  flyTo(s.ox, s.oy, s.scale, dur); renderScenes(); }                  // animate the camera rather than cutting (dur: tours glide slower)
function delScene(id){ scenes=scenes.filter(s=>s.id!==id); if(activeScene===id) activeScene=null; persistScenes(); renderScenes(); }
function renderScenes(){ const box=$('scenes'); box.innerHTML=''; box.appendChild(el('span','lab','scenes'));
  scenes.forEach(s=>{ const c=el('span','sc'+(s.id===activeScene?' on':'')); c.appendChild(el('span',null,s.name));
    const x=el('span','x','×'); x.onclick=ev=>{ ev.stopPropagation(); delScene(s.id); }; c.appendChild(x);
    c.onclick=()=>restoreScene(s); box.appendChild(c); });
  const exp=el('span','add','⤓ export'); exp.title='export scenes to a file, so `tessera scenes import` can move them into the graph';
  exp.onclick=()=>exportScenes(); box.appendChild(exp);
  const add=el('span','add','+'); add.title='save this view as a scene — captures the camera and, if a node is open, that node as the scene\'s focus (optional)'; add.onclick=()=>{ const inp=document.createElement('input'); inp.placeholder='name this view…';
    add.replaceWith(inp); inp.focus();
    inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') saveScene(inp.value); else if(ev.key==='Escape') renderScenes(); });
    inp.addEventListener('blur', ()=> saveScene(inp.value)); };
  box.appendChild(add);
  if(scenes.length){ const pl=el('span','add','▶ tour'); pl.title='play a tour through the saved scenes'; pl.onclick=()=>playTour(); box.appendChild(pl); }
}
// --- edge budget control
function renderEdgeCtl(){
  let box=document.getElementById('edgectl');
  if(!box){ box=document.createElement('div'); box.id='edgectl';
    box.style.cssText='position:fixed;left:14px;bottom:220px;z-index:6;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11px;color:var(--dim);min-width:190px';
    document.body.appendChild(box); }
  if(!PROM_MEASURES.length){ box.innerHTML='<div style="font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase">edge budget</div><div style="margin-top:5px">no prominence computed —<br>run <code>tessera view</code> again</div>'; return; }
  box.innerHTML='<div style="font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)">edge budget</div>';
  const sel=document.createElement('select');
  sel.style.cssText='width:100%;margin:6px 0 4px;background:var(--surface-3);color:var(--text);border:1px solid var(--line-2);border-radius:6px;padding:3px 5px;font-size:11px';
  for(const m of PROM_MEASURES.concat(['none'])){ const o=document.createElement('option'); o.value=m; o.textContent=m.replace(/_/g,' '); if(m===edgeMeasure) o.selected=true; sel.appendChild(o); }
  sel.onchange=()=>{ edgeMeasure=sel.value; rebuild(false); renderEdgeCtl(); };
  box.appendChild(sel);
  const lab=document.createElement('div'); lab.style.cssText='display:flex;justify-content:space-between;margin-top:3px';
  lab.innerHTML='<span>top '+edgeKeepPct+'%</span><span style="color:var(--faint)">'+EDGES.length+' edges</span>';
  const note=document.createElement('div');
  note.style.cssText='margin-top:5px;color:var(--faint);font-size:10px;line-height:1.35';
  note.textContent = edgeMeasure==='none' ? 'all edges drawn uniformly'
    : 'thicker + brighter = higher ' + edgeMeasure.replace(/_/g,' ');
  box.appendChild(note);
  box.appendChild(lab);
  const sl=document.createElement('input'); sl.type='range'; sl.min='1'; sl.max='100'; sl.value=String(edgeKeepPct);
  sl.style.cssText='width:100%;margin-top:3px'; sl.disabled=(edgeMeasure==='none');
  sl.oninput=()=>{ edgeKeepPct=Number(sl.value); rebuild(false); renderEdgeCtl(); };
  box.appendChild(sl);
}

loadScenes(); renderScenes(); renderEdgeCtl();

// --- DROP TARGET (slice 3). Only active when the page is SERVED — a file:// bundle has no server to post
// to, so the handlers are not installed and the page behaves exactly as before.
const SERVED = location.protocol === 'http:' || location.protocol === 'https:';
function dropUI(){
  let el=document.getElementById('dropzone');
  if(!el){ el=document.createElement('div'); el.id='dropzone';
    el.style.cssText='position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;'
      +'background:rgba(8,11,18,.82);backdrop-filter:blur(2px);font-size:18px;color:var(--text);pointer-events:none';
    document.body.appendChild(el); }
  return el;
}
function dropStatus(msg, sticky){
  let el=document.getElementById('dropstatus');
  if(!el){ el=document.createElement('div'); el.id='dropstatus';
    el.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:41;background:var(--surface-2);'
      +'border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:12px;color:var(--text);box-shadow:0 6px 24px rgba(0,0,0,.4)';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.display='block';
  if(!sticky) setTimeout(()=>{ el.style.display='none'; }, 4000);
}
if(SERVED){
  const zone=dropUI();
  let depth=0;
  addEventListener('dragenter', e=>{ e.preventDefault(); if(++depth===1){ zone.textContent='drop a .md or .txt to add it to this map'; zone.style.display='flex'; } });
  addEventListener('dragleave', e=>{ e.preventDefault(); if(--depth<=0){ depth=0; zone.style.display='none'; } });
  addEventListener('dragover', e=>e.preventDefault());
  addEventListener('drop', async e=>{
    e.preventDefault(); depth=0; zone.style.display='none';
    const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!f) return;
    if(!/\.(md|txt)$/i.test(f.name)){ dropStatus('only .md and .txt are supported — '+f.name+' was not ingested'); return; }
    dropStatus('reading '+f.name+'…', true);
    // The SSE stream carries per-chunk progress; extraction is ~10s per chunk, so a 20-page drop is minutes.
    const es=new EventSource('/events');
    es.onmessage=ev=>{
      try{ const p=JSON.parse(ev.data);
        if(p.phase==='chunk') dropStatus('ingesting '+f.name+' — chunk '+(p.i+1)+' of '+p.of+'…', true);
        else if(p.phase==='error') { dropStatus('ingest failed: '+p.message); es.close(); }
      }catch(_){}
    };
    try{
      const res=await fetch('/ingest',{ method:'POST', headers:{'X-Tessera-Filename': f.name}, body: await f.arrayBuffer() });
      const txt=await res.text();
      es.close();
      if(!res.ok){ dropStatus('ingest failed ('+res.status+'): '+txt.slice(0,120)); return; }
      const r=JSON.parse(txt);
      dropStatus('added '+r.entities+' entities, '+r.edges+' edges — reloading…', true);
      // v1 reloads rather than delta-patching the open map (design §5, deferred). Layout is durable and
      // additive, so the reload keeps every position you were looking at.
      setTimeout(()=>location.reload(), 900);
    }catch(err){ es.close(); dropStatus('ingest failed: '+err); }
  });
}

// --- scene EXPORT: the one-way door (design §5). localStorage is origin-scoped, so once tessera serves the
// viewer over http://127.0.0.1:PORT these scenes are unreachable from the new page. A file:// page cannot
// write SQLite, so the crossing is a two-artifact bridge: download here, `tessera scenes import` there.
//
// Each saved scene stores only a CAMERA (ox/oy/scale). We recover anchors by replaying that camera and
// asking which nodes were in frame — so a scene stops meaning "point the camera here" and starts meaning
// "show me these things", which survives any future re-settle.
//
// Mirrors selectAnchors() in src/scenes/scene.ts; test/scenes-bridge.test.ts extracts this function and
// asserts the two agree on the same input, so they cannot drift apart.
const ANCHOR_CAP=12, ANCHOR_FALLBACK=3;
function anchorsForCamera(cam){
  // NODES, not `nodes`: only the VISIBLE set. Hidden provenance nodes never receive stored layout (they have
  // no rows until slice 4), so they sit at their seed-ring coordinates near the world origin — inside exactly
  // the frames people save. They also keep a stale `deg` from any earlier `h` toggle, so they can outrank
  // real nodes in the sort. Anchoring a scene to them writes invisible chunk ids through the one-way door,
  // permanently, which is the corruption anchors exist to prevent.
  const pool = NODES;
  const inView = pool.filter(n=>{ const sx=n.x*cam.scale+cam.ox, sy=n.y*cam.scale+cam.oy;
    return sx>=0 && sx<=W && sy>=0 && sy<=H; });
  if(inView.length) return inView.slice().sort((a,b)=> b.deg-a.deg || (a.id<b.id?-1:1)).slice(0,ANCHOR_CAP).map(n=>n.id);
  const cx=(W/2-cam.ox)/cam.scale, cy=(H/2-cam.oy)/cam.scale;
  return pool.slice().sort((a,b)=> Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy) || (a.id<b.id?-1:1))
    .slice(0,ANCHOR_FALLBACK).map(n=>n.id);
}
function exportScenes(){
  if(!scenes.length){ alert('No scenes saved in this browser to export.'); return; }
  const payload = { graph: GRAPH.name||'graph',
    scenes: scenes.map((s,i)=>({ name:s.name||'', narr:s.narr||null, scale:s.scale, showProv:!!s.showProv,
      focusNode:s.node||null, anchors:anchorsForCamera(s), legacyId:s.id||null, ordinal:i })) };
  const blob = new Blob([JSON.stringify(payload,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (GRAPH.name||'graph')+'-scenes.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

// --- tours: play the saved scenes as a guided walkthrough — the camera flies stop→stop, narration per stop.
// v1: one implicit tour = all scenes in save order; narration lives on the scene. (Named tours + drag-reorder next.) ---
let tour=null;
function playTour(){ if(!scenes.length) return; tour={ i:-1, playing:true, timer:0 }; $('scenes').style.display='none'; tourGo(0); }
function tourGo(i){ if(!tour) return; tour.i=i; restoreScene(scenes[i], 1200); renderNow(); if(tour.playing) armAutoplay(); } // 1200ms: a slow, cinematic glide between narrated stops
function armAutoplay(){ clearTimeout(tour.timer); tour.timer=setTimeout(()=>{ if(tour.i<scenes.length-1) tourGo(tour.i+1); else { tour.playing=false; renderNow(); } }, 8000); }
function tourStep(d){ if(!tour) return; clearTimeout(tour.timer); tourGo(Math.max(0,Math.min(scenes.length-1,tour.i+d))); }
function tourToggle(){ if(!tour) return; tour.playing=!tour.playing; if(tour.playing) armAutoplay(); else clearTimeout(tour.timer); renderNow(); }
function exitTour(){ if(tour){ clearTimeout(tour.timer); tour=null; } $('nowplaying').style.display='none'; $('scenes').style.display=''; renderScenes(); }
function renderNow(){ const np=$('nowplaying'); np.style.display='block'; np.innerHTML='';
  const prog=el('div','prog'); scenes.forEach((s,i)=> prog.appendChild(el('i', i<=tour.i?'on':''))); np.appendChild(prog);
  const body=el('div','body'), ctrl=el('div','ctrl');
  const prev=el('span','b2','◀'); prev.onclick=()=>tourStep(-1);
  const pp=el('span','b2 play', tour.playing?'❙❙':'▶'); pp.onclick=()=>tourToggle();
  const next=el('span','b2','▶'); next.onclick=()=>tourStep(1);
  ctrl.append(prev,pp,next); body.appendChild(ctrl);
  const mid=el('div','mid'), s=scenes[tour.i];
  mid.appendChild(el('div','st','stop '+(tour.i+1)+' of '+scenes.length+'  ·  '+(s.name||'')));
  const ta=document.createElement('textarea'); ta.className='narr'; ta.rows=2; ta.placeholder='add narration for this stop…'; ta.value=s.narr||'';
  ta.oninput=()=>{ s.narr=ta.value; persistScenes(); }; mid.appendChild(ta); body.appendChild(mid);
  const ex=el('span','exit','exit'); ex.onclick=()=>exitTour(); body.appendChild(ex);
  np.appendChild(body);
}

rebuild(); showIdle(); draw();
</script>
</body>
</html>
