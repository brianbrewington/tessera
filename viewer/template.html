<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tessera</title>
<style>
  /* design tokens (from the Claude Design handoff) */
  :root{
    --ground:#0a0c11; --ground-2:#0e1218;
    --surface:#12161e; --surface-2:#171c26; --surface-3:#1e2531;
    --line:rgba(230,233,239,.09); --line-2:rgba(230,233,239,.16);
    --text:#e6e9ef; --dim:#8b93a7; --faint:#5e667b;
    --accent:#7aa2f7; --person:#e0af68; --tour:#bb9af7; --agent:#7dcfff; --conflict:#f7768e; --ok:#9ece6a;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--ground); color:var(--text); font:13px/1.5 var(--font); overflow:hidden; }
  canvas{ display:block; cursor:grab; }
  canvas.dragging{ cursor:grabbing; }
  button{ font-family:inherit; }

  #pill{ position:fixed; top:14px; left:14px; display:flex; align-items:center; gap:9px; height:38px; padding:0 14px;
    background:rgba(18,22,30,.9); border:1px solid var(--line-2); border-radius:10px; }
  #pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #pill .gname{ font-weight:600; font-size:13px; }
  #pill .gcount{ font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.04em; }
  /* Extraction debt, stated on the map itself. Without it a half-extracted graph is indistinguishable from
     a thin one, which is exactly how graphs/big carried two missing chunks for months without anyone knowing. */
  #pill .gdirty{ display:none; font-family:var(--mono); font-size:10px; letter-spacing:.04em; padding:2px 8px;
    border-radius:99px; color:#f0c674; background:rgba(240,198,116,.13); border:1px solid rgba(240,198,116,.42); cursor:help; }
  #pill .gdirty.on{ display:inline-block; }
  /* active drain reads as motion, settled debt reads as a note */
  #pill .gdirty.busy{ color:#8fd6a8; background:rgba(143,214,168,.13); border-color:rgba(143,214,168,.45); }

  #tip{ position:fixed; pointer-events:none; background:var(--surface-2); border:1px solid var(--line-2);
    border-radius:8px; padding:7px 10px; font-size:12.5px; line-height:1.5; color:var(--text); max-width:280px; display:none; z-index:6; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #tip .k{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); display:block; margin-bottom:3px; }
  #legend{ position:fixed; bottom:214px; left:14px; background:rgba(13,17,26,.86); border:1px solid var(--line);
    border-radius:10px; padding:9px 11px; font-size:11px; color:var(--dim); }
  /* semantic-zoom chrome — kept on the LEFT so it clears the right-side panel */
  /* #altrail (the left zoom-tier rail) was REMOVED: it listed continent/country/region/... and so does
     #zcrumb along the top, so the same information was on screen twice and the left column is the scarcer
     space. The styles are kept dormant below in case the rail earns its way back. */
  #altrail{ display:none; position:fixed; top:62px; left:14px; width:200px; background:rgba(13,17,26,.72); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px 8px 18px; pointer-events:none; }
  #altrail .r{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:2px 0; opacity:.38; transition:opacity .2s; }
  #altrail .r.on{ opacity:1; }
  #altrail .r .sb{ font-family:var(--mono); font-size:8.5px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; }
  #altrail .track{ position:absolute; left:9px; top:12px; bottom:12px; width:2px; background:var(--line-2); border-radius:2px; }
  #altrail .dot{ position:absolute; left:6px; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); transition:top .25s; }
  #zcrumb{ position:fixed; top:16px; left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--dim); background:rgba(13,17,26,.7); border:1px solid var(--line); border-radius:99px; padding:5px 13px; pointer-events:none; }
  #minimap{ position:fixed; bottom:14px; left:14px; width:268px; background:rgba(13,17,26,.86); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  #minimap .mm-head{ display:flex; justify-content:space-between; align-items:center; padding:6px 10px; font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); }
  #minimap canvas{ display:block; background:#080a0f; cursor:crosshair; }
  /* scenes — saved views. A VERTICAL stack in the left column, between the zoom rail and the edge budget.
     It was a bottom-centre row that grew a horizontal scrollbar past a handful of scenes (unreadable, and
     the scrollbar sat across the map), while this column had an unused gap the whole time. Vertical also
     gives drag-reorder an obvious place to grab. */
  /* top clears #altrail (the zoom-tier rail); bottom clears #edgectl, which sits at bottom:220 and is about
     110px tall. Both neighbours are fixed-position, so this column is a budget, not a flow. */
  #scenes{ position:fixed; left:14px; top:232px; bottom:356px; width:268px; display:flex; flex-direction:column;
    gap:6px; z-index:6; pointer-events:none; }
  #scenes > *{ pointer-events:auto; }
  #scenes .list{ display:flex; flex-direction:column; gap:4px; overflow-y:auto; overflow-x:hidden; min-height:0; }
  #scenes .sc{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:5px 9px; cursor:pointer; }
  #scenes .sc .grip{ color:var(--faint); font-size:11px; cursor:grab; flex:0 0 auto; letter-spacing:-1px; }
  #scenes .sc .nm{ flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #scenes .sc.dragging{ opacity:.4; }
  #scenes .sc.over{ border-color:var(--accent); box-shadow:inset 0 2px 0 -1px var(--accent); }
  #scenes .foot{ display:flex; flex-wrap:wrap; gap:5px; flex:0 0 auto; }
  #scenes .lab{ font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); flex:0 0 auto; }
  #scenes .sc:hover{ border-color:var(--accent); }
  #scenes .sc.on{ background:rgba(122,162,247,.14); border-color:rgba(122,162,247,.4); color:#c8d8fc; }
  #scenes .sc .x{ color:var(--faint); font-size:12px; line-height:1; }
  #scenes .sc .x:hover{ color:var(--conflict); }
  #scenes .add{ font-family:var(--mono); font-size:11px; color:var(--dim); background:var(--surface-3); border:1px solid var(--line-2); border-radius:99px; padding:4px 11px; cursor:pointer; flex:0 0 auto; }
  #scenes .add:hover{ border-color:var(--accent); color:var(--text); }
  #scenes input{ font:inherit; font-size:12px; background:var(--surface-3); border:1px solid var(--accent); border-radius:99px; padding:4px 11px; color:var(--text); width:150px; outline:none; }
  /* tours — now-playing bar (violet = tour mode) */
  #nowplaying{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); width:min(860px,86vw); display:none;
    background:rgba(18,22,30,.95); border:1px solid rgba(187,154,247,.35); border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,.7); overflow:hidden; z-index:7; }
  #nowplaying .prog{ display:flex; gap:2px; height:3px; }
  #nowplaying .prog i{ flex:1 1 0; background:var(--surface-3); }
  #nowplaying .prog i.on{ background:var(--tour); }
  #nowplaying .body{ display:flex; align-items:center; gap:12px; padding:10px 14px; }
  #nowplaying .ctrl{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  #nowplaying .b2{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--line-2); background:var(--surface-3); color:var(--text); font-size:12px; }
  #nowplaying .b2.play{ width:42px; height:42px; background:var(--tour); color:#140f1e; border-color:var(--tour); font-size:14px; }
  #nowplaying .mid{ flex:1 1 auto; min-width:0; }
  #nowplaying .st{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--tour); margin-bottom:3px; }
  #nowplaying textarea.narr{ font:inherit; font-size:15px; line-height:1.45; color:var(--text); background:transparent; border:none; outline:none; width:100%; resize:none; }
  #nowplaying .exit{ flex:0 0 auto; color:var(--dim); cursor:pointer; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
  #nowplaying .exit:hover{ color:var(--text); }
  /* collapsible tool groups — the left column now holds three of them and they do not all need to be open */
  .grp{ margin-bottom:9px; }
  .grp > .gh{ display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    user-select:none; padding:1px 0; }
  .grp > .gh:hover{ color:var(--accent); }
  .grp > .gh .car{ transition:transform .18s; }
  .grp.closed > .gh .car{ transform:rotate(-90deg); }
  .grp.closed > .gb{ display:none; }
  .grp > .gb{ padding-top:6px; }
  #legend .row{ display:flex; align-items:center; gap:7px; margin:3px 0; }
  #legend .dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  #legend .ln{ width:16px; height:0; border-top:2px solid; flex:0 0 auto; }

  /* panel — one component, depths via .deep / .edge */
  #panel{ position:fixed; top:14px; right:14px; bottom:14px; width:396px; max-width:82vw;
    display:flex; flex-direction:column; background:rgba(18,22,30,.92); border:1px solid var(--line-2);
    border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5); transform:translateX(calc(100% + 24px));
    transition:transform .2s ease, width .18s ease; overflow:hidden; }
  #panel.open{ transform:translateX(0); }
  #panel.deep{ width:470px; background:rgba(18,22,30,.95); box-shadow:0 16px 55px rgba(0,0,0,.6); }
  #panel.edge{ width:452px; }
  .p-head{ display:flex; align-items:center; gap:8px; padding:13px 16px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .p-head .crumb{ flex:1 1 auto; min-width:0; font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-head .crumb b{ color:var(--text); font-weight:500; }
  .p-head .sq{ width:26px; height:26px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:var(--surface-3); border:1px solid var(--line); border-radius:7px; color:var(--dim); cursor:pointer; font-size:14px; }
  .p-head .sq:hover{ color:var(--text); border-color:var(--line-2); }
  .p-head .badge{ font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
    background:rgba(122,162,247,.12); border:1px solid rgba(122,162,247,.3); border-radius:5px; padding:3px 6px; flex:0 0 auto; }
  .p-scroll{ flex:1 1 auto; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:16px; }
  .p-actions{ flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  .p-actions:empty{ display:none; }

  .ident{ display:flex; flex-direction:column; gap:11px; }
  .ident .top{ display:flex; align-items:center; gap:11px; }
  .avatar{ width:34px; height:34px; flex:0 0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; color:var(--ground); }
  .ident h2{ margin:0; font-size:21px; font-weight:600; letter-spacing:-.015em; line-height:1.15; text-wrap:balance; overflow-wrap:anywhere; }
  .kv{ display:flex; gap:8px; font-size:11px; }
  .kv b{ font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); min-width:52px; flex:0 0 auto; }
  .kv .val{ color:var(--dim); word-break:break-all; }
  .ident .kind{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; margin-top:3px; }
  .stats{ display:flex; gap:8px; }
  .tile{ flex:1 1 0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
  .tile .l{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .tile .v{ font-size:14px; font-weight:600; margin-top:2px; }

  .slabel{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); }
  .desc{ font-size:13.5px; line-height:1.65; color:var(--text); text-wrap:pretty; white-space:pre-wrap; overflow-wrap:anywhere; }
  .desc.clamp{ max-height:88px; overflow:hidden; }
  /* Source text, shown whole and set to read as a quotation rather than as prose we wrote. */
  .desc.verbatim{ white-space:pre-wrap; font-size:12.5px; line-height:1.55; color:var(--dim);
    border-left:2px solid var(--line-2); padding-left:11px; }
  .reveal{ color:var(--accent); cursor:pointer; font-size:12.5px; margin-top:-8px; display:inline-block; }
  .section{ display:flex; flex-direction:column; gap:8px; }
  .section .hd{ display:flex; align-items:baseline; justify-content:space-between; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:99px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--text); }
  .chip:hover{ border-color:var(--accent); }
  .chip .cd{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .chip.out{ background:transparent; color:var(--dim); }

  .card{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; display:flex; flex-direction:column; gap:6px; }
  .card .name{ display:flex; align-items:center; gap:7px; font-size:13px; }
  .card .name .lnk{ cursor:pointer; }
  .card .name .lnk:hover{ color:var(--accent); }
  .wbar{ display:flex; align-items:center; gap:7px; }
  .wbar .track{ height:3px; background:var(--surface-3); border-radius:2px; overflow:hidden; }
  .wbar .fill{ height:100%; background:var(--accent); }
  .wbar .wv{ font-family:var(--mono); font-size:10px; color:var(--faint); }
  .quote{ font-size:12.5px; line-height:1.6; color:var(--dim); text-wrap:pretty; overflow-wrap:anywhere; }
  .src{ font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--faint); }
  .src-link{ cursor:pointer; } .src-link:hover{ color:var(--accent); }

  .ends{ display:flex; align-items:stretch; gap:8px; }
  .ecard{ flex:1 1 0; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer; }
  .ecard:hover{ border-color:var(--accent); }
  .ecard .en{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ecard .et{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-top:3px; }
  .ejoin{ flex:0 0 auto; display:flex; align-items:center; color:var(--dim); font-size:16px; }
  .kbadge{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); background:var(--surface-3); border-radius:5px; padding:3px 7px; }
  .rcard{ border-left:2px solid var(--line-2); background:var(--surface-2); border-radius:0 10px 10px 0; padding:9px 12px; display:flex; flex-direction:column; gap:5px; }
  .rcard.newest{ border-left-color:var(--accent); }

  .btn{ height:34px; padding:0 13px; border-radius:8px; font-size:12.5px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-2); background:var(--surface-3); color:var(--text); }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); color:var(--ground); border-color:var(--accent); font-weight:600; }
  .btn.ghost{ background:transparent; color:var(--dim); }
  .btn.right{ margin-left:auto; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .btn[disabled]:hover{ border-color:var(--line-2); }

  .idle h2{ margin:0 0 8px; font-size:17px; font-weight:600; }
  .idle p{ margin:0 0 14px; color:var(--dim); font-size:13px; line-height:1.6; }
  .keys{ display:flex; flex-direction:column; gap:7px; }
  .keyrow{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--dim); }
  .keycap{ font-family:var(--mono); font-size:10px; min-width:64px; text-align:center; padding:4px 6px; background:var(--surface-3); border:1px solid var(--line-2); border-radius:6px; color:var(--text); }
  .appears{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pill"><span class="dot"></span><span class="gname" id="gname"></span><span class="gcount" id="gcount"></span><span class="gdirty" id="gdirty"></span></div>
<div id="zcrumb"></div>
<div id="tip"></div>
<div id="legend"></div>
<div id="minimap"><div class="mm-head"><span>OVERVIEW</span><span id="mmzoom">1.00×</span></div><canvas id="mmc" width="268" height="168"></canvas></div>
<div id="scenes"></div>
<div id="nowplaying"></div>
<div id="panel">
  <div class="p-head">
    <div class="sq" id="pback" title="back" style="display:none">‹</div>
    <div class="crumb" id="crumb"></div>
    <span class="badge" id="pbadge" style="display:none">deep inspect</span>
    <div class="sq" id="pclose" title="close">✕</div>
  </div>
  <div class="p-scroll" id="pscroll"></div>
  <div class="p-actions" id="pactions"></div>
</div>
<script>
const GRAPH = /*__GRAPH_DATA__*/ {nodes:[],edges:[]};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio||1, 2);
function resize(){ W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();
const $=id=>document.getElementById(id);

// Escape model/user-controlled strings before ANY innerHTML interpolation (a name like "<img onerror=…>"
// must not execute). textContent paths (title, body, tooltip, chips) need no escaping.
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- model (positions seeded on a ring, then settled) ---
// Seed positions are index-derived over the FULL node list (provenance included) — see design §3.2.
// `sx/sy` keep the seed so the fallback can restart from it; `x/y` may be replaced by stored layout below.
const nodes = GRAPH.nodes.map((n,i)=>({ ...n,
  sx: Math.cos(i)*220 + (i%7-3)*30, sy: Math.sin(i)*220 + (i%5-2)*30,
  x: Math.cos(i)*220 + (i%7-3)*30, y: Math.sin(i)*220 + (i%5-2)*30, vx:0, vy:0, deg:0 }));
const LAYOUT = GRAPH.layout || {};
// --- edge attention budget: rank edges by a chosen prominence measure and draw only the top slice.
// hebbian_weight is deliberately NOT an option: it is 1 on ~94% of real edges, so filtering by it is
// thresholding a constant. 'none' keeps every edge (what the viewer did before).
const PROM = GRAPH.prominence || {};
const PROM_MEASURES = Object.keys(PROM);
let edgeMeasure = PROM_MEASURES.includes('betweenness') ? 'betweenness'
                : (PROM_MEASURES[0] || 'none');
let edgeKeepPct = 100;   // show the top N% of edges by the chosen measure
let edgeCut = -Infinity; // recomputed whenever measure or percentage changes
const byId = new Map(nodes.map(n=>[n.id,n]));
const edges = GRAPH.edges.map(e=>({ ...e, a:byId.get(e.from), b:byId.get(e.to) })).filter(e=>e.a&&e.b);

// Provenance nodes (the document + its chunks) are PRESENT in the data but hidden by default — they're the
// RAG substrate, not the semantic map. Press 'h' to reveal them (and their APPEARED_IN/ORIGINATED_FROM edges).
const isProv = n => n.type==='SOURCE' && (n.group==='chunk' || n.group==='document');
let showProv = false;
let NODES=[], EDGES=[], maxDeg=1;
let edgeEpoch=0;   // bumped by rebuild(); anything caching over EDGES keys on it
function rebuild(reposition){
  if(reposition===undefined) reposition=true;
  const vis = new Set(nodes.filter(n=>showProv||!isProv(n)));
  NODES = [...vis];
  EDGES = edges.filter(e=>vis.has(e.a)&&vis.has(e.b));
  // apply the attention budget: keep the top edgeKeepPct% by the selected measure
  if(edgeMeasure!=='none' && PROM[edgeMeasure] && edgeKeepPct<100){
    const tbl=PROM[edgeMeasure];
    const scored=EDGES.map(e=>tbl[e.id]??0).sort((a,b)=>b-a);
    const k=Math.max(1, Math.floor(scored.length*edgeKeepPct/100));
    edgeCut = scored[k-1] ?? -Infinity;
    EDGES = EDGES.filter(e=>(tbl[e.id]??0) >= edgeCut);
  } else { edgeCut = -Infinity; }
  // Visual weight: rank the surviving edges 0..1 so thickness/opacity can carry prominence. Percentile
  // rather than raw value because betweenness spans four orders of magnitude — on a linear scale all but a
  // handful of edges would render invisible. Computed AFTER filtering, so contrast is relative to what is
  // actually on screen.
  if(edgeMeasure!=='none' && PROM[edgeMeasure]){
    const ptbl=PROM[edgeMeasure];
    const order=EDGES.map(e=>({e, v:ptbl[e.id]??0})).sort((p,q)=>p.v-q.v);
    const last=Math.max(1, order.length-1);
    // AVERAGE ranks across ties. Betweenness produces mass ties (every edge on no shortest path scores
    // exactly 0), and strict ranking would spread them across a whole range of widths and opacities —
    // rendering differences that do not exist, ordered by nothing but array position.
    let i=0;
    while(i<order.length){
      let j=i; while(j+1<order.length && order[j+1].v===order[i].v) j++;
      const shared=((i+j)/2)/last;
      for(let k=i;k<=j;k++) order[k].e.prom = shared;
      i=j+1;
    }
  } else { for(const e of EDGES) e.prom = 0.5; }
  edgeEpoch++;                     // EDGES has just been replaced — invalidate anything derived from it
  recomputeZoomCeiling();          // the visible set changed, so the tightest spacing may have too
  for(const n of NODES) n.deg=0;
  for(const e of EDGES){ e.a.deg++; e.b.deg++; }   // degree over VISIBLE edges → size = semantic connectivity
  maxDeg = Math.max(1, ...NODES.map(n=>n.deg));
  // --- design §3.4: ALL-OR-NOTHING. One decision over the whole visible set, never per node.
  // complete   -> use every stored position and never settle (the map you learned stays put)
  // incomplete -> ignore stored layout ENTIRELY, restart from the seeds, and run the full settle.
  // Mixing is forbidden: settle() does not re-seed (it zeroes velocities only), so a stored/seeded hybrid
  // would move anchored nodes along a trajectory that depends on which rows happened to exist.
  // `reposition` is false when only the EDGE BUDGET changed. A draw filter must never move nodes: settle()
  // pulls along EDGES, so re-settling per slider tick would make the geometry depend on the slider position
  // — and in the fallback path that is a full settle, measured at 36.6s on the 10x graph, per tick.
  const complete = NODES.length>0 && NODES.every(n=>LAYOUT[n.id]);
  if(reposition){
    if(complete){ for(const n of NODES){ const p=LAYOUT[n.id]; n.x=p[0]; n.y=p[1]; n.vx=0; n.vy=0; } }
    else { for(const n of NODES){ n.x=n.sx; n.y=n.sy; n.vx=0; n.vy=0; } settle(); }
  }
  computeBounds(); renderMMDots(); buildLegend(); updateCounts();
}

// --- colour: coarse buckets, deliberately few. Person vs. the rest, because 7 shades of one hue don't read.

// Visual weight follows PROMINENCE, and how hard it follows depends on ALTITUDE.
//
// Why this exists (measured on testgraph, 1714 entities): 346 nodes — a FIFTH of the map — have zero
// semantic links, and another 882 have exactly one. So ~72% of what you see at continent zoom is degree ≤1.
// Drawn at full opacity with a full glow halo, that mass is not information, it is fog, and it buries the
// handful of real hubs the altitude exists to show. Size already encoded prominence via radius(); opacity
// encoded only focus state, so at 0.4x every node shouted equally loudly.
//
// FADING IS NOT FILTERING, and the distinction is load-bearing. nodeAt() hit-tests on radius and never on
// alpha, so a faint node stays clickable, hoverable and findable, and returns to full strength as you
// descend. Nothing is removed from the map; the map just stops shouting.
// The usable opacity band for a de-emphasized item, and it is much narrower than intuition suggests.
//
// Harrison, Ishii, Vicente & Buxton (CHI '95, pp. 317-324) measured interference from a faded item with a
// Stroop paradigm and found post-hoc groupings of {100, 50, 20} | 10 | 5 | 0. Aboelsaadat & Balakrishnan
// (British HCI 2004, pp. 53-67, N=16) independently reproduced the same breakpoints nine years later:
// {100, 75, 50, 25} | {10, 7.5} | {5}. Two consequences that are counterintuitive and that this code got
// wrong on its first pass:
//
//   1. The curve is FLAT from ~25% to 100%. Fading something from 1.0 to 0.5 buys almost nothing. Any
//      intermediate alpha above 0.25 is perceptually spent for no return.
//   2. Alpha near 0.5 is close to the PEAK of the interference curve — the most distracting place to put a
//      de-emphasized item, not a polite middle. The first version of this table parked the `district` tier
//      at 0.60 and `city` at 0.30, which is precisely the dead zone: it looked like a fade and did nothing.
//
// Bartram & Stone (IEEE TVCG 17(10):1444-1458, 2011) asked the boundary-condition question directly and give
// ~0.1 for backgrounds that are not too dense, 0.2 universally. They name the top-of-range failure the
// "fence effect": past a threshold, backgrounded structure stops reading as a layer BEHIND the data and
// starts reading as a barrier in front of it.
//
// EXTRAPOLATION, STATED HONESTLY: every measurement above used thin reference structures (grid lines) or
// Stroop stimuli. Nobody has run this on de-emphasized CONTENT items in a working display. 0.10-0.20 is the
// best-grounded number available and it is still being applied outside the setting where it was measured.
// One boundary is known: Mairena, Gutwin & Cockburn (Information Visualization 21(2), 2022) found opacity
// de-emphasis fails outright on space-filling layouts (max accuracy 0.56 on a HexbinMap at any magnitude).
// This viewer draws discrete marks, so that failure mode does not apply here — but it would if a zoom level
// ever rendered filled regions.
const BG_LO = 0.10, BG_HI = 0.20;   // ordering stays legible inside the band; 5/10/20 are distinguishable
// The evidence band (0.10-0.20) is for "backgrounded but still present". Brian's ask is different — he wants
// the unlinked mass effectively GONE at altitude, not politely quiet. Those are two intents and the slider
// should reach both, so its last third pushes the floor BELOW the band, down to 0.03. That is deliberately
// outside what Harrison et al. and Bartram & Stone measured, and it is outside for a stated reason: their
// question was legibility of a backgrounded item, and past 70% this control is answering "remove it".
const BG_MIN = 0.03;
const KNEE  = 0.7;                  // where the crossing to "present" begins

// HOW HARD to apply the fade, 0..1, user-adjustable like the edge budget. The right aggressiveness is a
// property of the GRAPH, not of the renderer: a dense well-connected corpus wants little of this, and one
// that is 72% singletons wants a lot. Rather than guess a constant per corpus, expose the knob. 0 reproduces
// the old behaviour exactly (every node at full opacity), 1 is the full curve.
let fadeStrength = 1;
function nodeAlpha(n, tier){
  if(fadeStrength <= 0) return 1;
  if(tier.name === 'building') return 1;                      // the ground floor: nothing is dimmed, ever
  // `tier.deg` is the degree at which a node BELONGS at this altitude — the same threshold the label budget
  // already uses, so opacity and labelling tell the same story instead of two different ones.
  const belong = Math.min(1, (n.deg||0) / Math.max(1, tier.deg));
  // Two regimes, because the perceptual evidence says there are only two useful states. Below the knee a
  // node is BACKGROUNDED and lives inside 0.10-0.20, where relative ordering is still readable (so the weak
  // still fade faster than the strong, which is the behaviour this was built for) without sitting in the
  // interference peak. Above the knee it CROSSES to present quickly rather than lingering in the 0.25-1.0
  // band where extra resolution is perceptually wasted.
  // Below 70% the floor is the evidence-backed 0.10; the last third drives it to 0.03.
  const lo = BG_LO - (BG_LO - BG_MIN) * Math.max(0, (fadeStrength - 0.7) / 0.3);
  const a = belong < KNEE
    ? lo + (BG_HI - lo) * Math.pow(belong / KNEE, 0.7)
    : BG_HI + (1 - BG_HI) * ((belong - KNEE) / (1 - KNEE));

}

function buildLegend(){

// --- force layout: settle ONCE (here / on toggle), then FREEZE. Moving nodes only induced churn, so the
// layout is static after this — pan & zoom move the camera, not the graph. ---
function settle(){
  const kRep=5200, kSpring=0.045, rest=90, grav=0.012;
  for(const n of NODES){ n.vx=0; n.vy=0; }
  for(let it=0; it<500; it++){
    const alpha = Math.max(0.03, Math.pow(0.992, it));
    for(let i=0;i<NODES.length;i++){ const a=NODES[i];
      for(let j=i+1;j<NODES.length;j++){ const b=NODES[j];
        let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2);
        const f=kRep/d2, fx=f*dx/d, fy=f*dy/d; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy; }
      a.vx-=a.x*grav; a.vy-=a.y*grav;
    }
    for(const e of EDGES){ let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, d=Math.hypot(dx,dy)||0.01;
      const f=kSpring*(d-rest), fx=f*dx/d, fy=f*dy/d; e.a.vx+=fx; e.a.vy+=fy; e.b.vx-=fx; e.b.vy-=fy; }
    for(const n of NODES){ n.x+=n.vx*alpha; n.y+=n.vy*alpha; n.vx*=0.82; n.vy*=0.82; }
  }
}

// The direct neighbourhood, used both for drawing and — importantly — for INTERACTION. Once a node is

// neighbourhood no longer means fighting hover targets that belong to something else. You leave by clicking
// empty space, which is a deliberate act rather than an accident of where the mouse drifted.

// --- HOP DISTANCE (Matthew's idea): let the GRAPH give the opacity ---------------------------------------
// BFS from the selected node, so a node's dimming is its distance in the structure rather than a flat
// in/out. Recomputed only when the selection changes, not per frame.
// Keyed on the SELECTION AND the edge set. Keying on the selection alone was a bug: rebuild() replaces EDGES
// whenever the edge-budget slider moves or `h` toggles provenance, and with a node still selected the cached
// distances then described a structure no longer on screen. That is worse than not dimming, because a wrong
// dimming still looks authoritative.

      base = 1;
    } else {
      a = dim ? 1 : ((n===selected||n===hoverNode||(focusSet&&focusSet.has(n.id))) ? 1 : nodeAlpha(n, tier));
      base = dim ? 0.18 : 1;
    }
    // The halo fades QUADRATICALLY while the core fades linearly. The halo is 2.4x the radius and it ADDS
    // across overlapping neighbours, so on a crowded map it — not the core — is what turns 1714 nodes into a
    // uniform grey wash. Killing it early on weak nodes buys most of the clarity at no cost to legibility.
    ctx.globalAlpha = base * a * a;

    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rr*2.4,0,7); ctx.fill();
    ctx.globalAlpha = base * a;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill();   // core
    if(n===selected||n===hoverNode){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
  // labels by tier: which nodes label (degree budget for the altitude) + how the type reads. Landmarks
  // (hover/selected/focus) always label; viewport-culled + capped so a low altitude doesn't flood.
  // Type encodes PROMINENCE, not just camera altitude. A node that BELONGS at this tier (deg ≥ threshold) gets
  // the tier's grand type; a punch-through node you merely selected/hovered that does NOT belong (a minor node)
  // gets a muted focus style — so clicking a town at country zoom doesn't render it as a country. (Real cure for
  // "one name for the group" at altitude is the deferred community labels; this keeps the metaphor honest meanwhile.)
  const FOCUS={size:12.5, w:'500', fam:FF.sans, track:0, ink:'#dfe4ee'};
  ctx.textAlign='center'; ctx.textBaseline='top';
  const always=n=> n===hoverNode||n===selected||(focusSet&&focusSet.has(n.id));
  const vis0=NODES.filter(n=> !(focusSet&&!focusSet.has(n.id)))
    .map(n=>{ const [x,y]=toScreen(n.x,n.y); return {n,x,y}; })
    .filter(o=> o.x>-60&&o.x<W+60&&o.y>-30&&o.y<H+30);
  const keep=vis0.filter(o=> always(o.n));  // hover/selection/focus labels — drawn additively, on TOP of the tier set
  // The tier's landmark set is STABLE, sized by the budget alone — a transient hover/selection label must NOT
  // steal a slot, or hovering a node in one corner makes a landmark pop in/out elsewhere on the map (the map
  // must not reshuffle when you interact locally). So slice to the full budget, not budget-minus-keep.
  const rest=vis0.filter(o=> !always(o.n) && o.n.deg>=tier.deg).sort((a,b)=> b.n.deg-a.n.deg).slice(0, tier.budget);
  for(const {n,x,y} of keep.concat(rest)){
    const T = (n.deg>=tier.deg) ? tier : FOCUS;   // belongs here → tier type; punch-through minor → muted focus
    ctx.font=T.w+' '+T.size+'px '+T.fam;
    try{ ctx.letterSpacing=((T.track||0)*T.size).toFixed(1)+'px'; }catch(e){}
    let t=(n.label||''); if(T.caps) t=t.toUpperCase(); else if(T.title) t=titleCase(t); if(t.length>44) t=t.slice(0,43)+'…';
    const by=y+radius(n)+4, w=ctx.measureText(t).width;
    ctx.fillStyle='rgba(10,12,17,0.66)'; ctx.fillRect(x-w/2-4, by, w+8, T.size+4);
    ctx.fillStyle=T.ink; ctx.fillText(t, x, by+2);
  }
  try{ ctx.letterSpacing='0px'; }catch(e){} ctx.textBaseline='alphabetic';
  drawMinimap();
  if(ti!==lastTi){ updateChrome(ti); lastTi=ti; }
  requestAnimationFrame(draw);
}

// --- hit testing (visible nodes/edges only) ---
function nodeAt(px,py){ let best=null,bd=1e9;
  for(const n of NODES){ const [x,y]=toScreen(n.x,n.y); const d=Math.hypot(px-x,py-y); if(d<radius(n)+6 && d<bd){bd=d;best=n;} }
  return best; }
function edgeAt(px,py){ let best=null,bd=7;
  for(const e of EDGES){ const [ax,ay]=toScreen(e.a.x,e.a.y),[bx,by]=toScreen(e.b.x,e.b.y);
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1; let t=((px-ax)*dx+(py-ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const cx=ax+t*dx, cy=ay+t*dy, d=Math.hypot(px-cx,py-cy); if(d<bd){bd=d;best=e;} }
  return best; }

const tip=$('tip');
cv.addEventListener('mousemove', ev=>{

  if(hoverEdge){ tip.style.display='block'; tip.style.left=(px+12)+'px'; tip.style.top=(py+12)+'px';

    // joins). A mono kind+weight line sits above it. Fall back to endpoint names only when there's no reason.
    tip.innerHTML = '<span class="k">'+esc(hoverEdge.kind)+' · w '+(+hoverEdge.w||1)+'</span>'

cv.addEventListener('mousedown', ev=>{ if(ev.button!==0) return; camAnim=null; panning=true; cv.classList.add('dragging'); lastX=downX=ev.clientX; lastY=downY=ev.clientY; });
addEventListener('mouseup', ev=>{ if(ev.button!==0) return;

    if(selected){
      // Locked: only the focused neighbourhood answers a click. Anything else — including an unrelated edge
      // lying under the pointer — means "I am done here", and releases the selection instead of jumping the
      // panel somewhere you did not intend to go.
      const f = computeFocus();

// --- panel: idle / node focus (left-click) / node deep (right-click) / edge — one component, breadcrumb walk ---
const panel=$('panel'), pscroll=$('pscroll'), pactions=$('pactions'), crumb=$('crumb');
let walk=[]; // breadcrumb of visited node ids
let curEdge=null; // the edge shown in the panel, if any (selected tracks a node instead)
const trunc=(s,n)=>{ s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s; };

const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
function clearPanel(){ pscroll.innerHTML=''; pactions.innerHTML=''; }
function neighborsOf(n){ return EDGES.filter(e=>(e.a===n||e.b===n) && e.a!==e.b).map(e=>({ node:e.a===n?e.b:e.a,
  reason:e.reason, reasons:(e.reasons&&e.reasons.length)?e.reasons:(e.reason?[e.reason]:[]), kind:e.kind, w:+e.w||1 })); }
function provChunks(n){ return edges.filter(e=>e.a===n && e.kind==='APPEARED_IN').map(e=>e.b.label||'').filter(Boolean); }

function centerOn(n){ ox=W/2-n.x*scale; oy=H/2-n.y*scale; }
/**
 * Frame every visible node. Needed after applying a computed layout: writeBack normalises the optimiser's
 * output to its own world radius, which has no relation to where the camera was looking at the CLI layout.
 * Found by review — without this, Apply can drop the whole graph off-screen and read as "Compute failed".
 */
// --- ADAPTIVE ZOOM CEILING ------------------------------------------------------------------------------
// A fixed 8x cap was sized for the force layout, whose repulsion term establishes a hard minimum spacing
// (measured: ~20 world units, so the tightest real pair is already 160px apart at 8x). It is meaningless for
// a t-SNE layout, where non-uniform spacing is the entire point and a cluster can be a few units across —
// you hit the ceiling long before the cluster comes apart. So the ceiling follows the geometry instead.
//
// COINCIDENT NODES ARE EXCLUDED and are a different problem: this graph has 20 nodes at EXACTLY the same
// position, and no zoom level separates a zero distance. Including them would drive the ceiling to infinity
// while fixing nothing. They need a draw-time offset, which is a separate change.
const ZOOM_GAP_PX = 44;      // the on-screen separation the tightest real pair should reach at full zoom
const ZOOM_MIN = 0.12, ZOOM_FLOOR_MAX = 8, ZOOM_HARD_MAX = 400;
let maxScale = ZOOM_FLOOR_MAX;

/** Low percentile of nearest-neighbour distance, grid-bucketed so this stays linear rather than O(n^2). */
function tightestSpacing(pts){
  if(pts.length < 2) return null;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of pts){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  const span=Math.max(x1-x0, y1-y0) || 1;
  const cell=Math.max(1e-6, span/Math.max(8, Math.floor(Math.sqrt(pts.length))));
  const grid=new Map();
  pts.forEach((p,i)=>{ const k=Math.floor(p[0]/cell)+','+Math.floor(p[1]/cell);
    if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(i); });
  const nn=[];
  pts.forEach((p,i)=>{
    let best=Infinity; const gx=Math.floor(p[0]/cell), gy=Math.floor(p[1]/cell);
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++)
      for(const j of (grid.get((gx+dx)+','+(gy+dy))||[])){
        if(i===j) continue;
        const d=Math.hypot(p[0]-pts[j][0], p[1]-pts[j][1]);
        if(d>1e-3 && d<best) best=d;          // >1e-3 skips coincident pairs, which zoom cannot help
      }
    if(Number.isFinite(best)) nn.push(best);
  });
  if(!nn.length) return null;
  nn.sort((a,b)=>a-b);
  return nn[Math.floor(0.02*(nn.length-1))];   // p2: ignore a handful of outliers, still serve the tight tail
}
function recomputeZoomCeiling(){
  const sep = tightestSpacing(NODES.map(n=>[n.x,n.y]));
  maxScale = sep ? Math.min(ZOOM_HARD_MAX, Math.max(ZOOM_FLOOR_MAX, ZOOM_GAP_PX/sep)) : ZOOM_FLOOR_MAX;
}

function fitAll(){
  if(!NODES.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const n of NODES){ if(n.x<x0)x0=n.x; if(n.x>x1)x1=n.x; if(n.y<y0)y0=n.y; if(n.y>y1)y1=n.y; }
  const w=Math.max(1,x1-x0), h=Math.max(1,y1-y0);
  scale=Math.max(ZOOM_MIN,Math.min(maxScale, 0.86*Math.min(W/w, H/h)));
  ox=W/2-((x0+x1)/2)*scale; oy=H/2-((y0+y1)/2)*scale;
}

function setCrumb(n){ crumb.innerHTML='';

function tile(l,v){ const t=el('div','tile'); t.appendChild(el('div','l',l)); t.appendChild(el('div','v',String(v))); return t; }
function chipEl(node){ const c=el('span','chip'); const d=el('span','cd'); d.style.background=colorFor(node);
  c.appendChild(d); c.appendChild(el('span',null,node.label||node.id)); c.onclick=()=>walkTo(node); return c; }
function mkBtn(label,cls,onclick){ const b=el('button','btn'+(cls?' '+cls:''),label); if(onclick) b.onclick=onclick; else b.disabled=true; return b; }

// backlink into provenance: reveal the chunk layer if needed, then open the source chunk (its raw text is the description)
/**
 * Open a node that may currently be hidden (an "appears in" link targets a document or chunk).
 *
 * This used to call rebuild() with repositioning on, and that was a trap. Revealing provenance widens the
 * visible set to nodes that have NO stored layout row (slice 4 is unstarted, so provenance never gets one).
 * The §3.4 all-or-nothing rule then correctly concluded the layout was incomplete, threw away every stored
 * position, and ran a FULL settle from the seeds. Consequences, all of which Brian hit at once: seconds of
 * frozen main thread on a 2055-node graph (the same path measured at 36.6s on the 10x graph), every node on
 * the map moved, and the click did not arrive because centerOn raced the relaxation.
 *
 * That is worse than slow: the durable map is the whole point of slice 1, and a navigation affordance was
 * silently destroying it.

 * So: place the newcomers against the frozen field and move nobody else. Same rule the server-side
 * incremental pass uses. Slice 4 (provenance in the layout) removes the need for this entirely by giving
 * provenance real rows; until then this keeps the map still.

function revealAndGo(node){
  if(!NODES.includes(node)){
    const placed = new Set(NODES.map(n=>n.id));
    showProv = true;
    rebuild(false);                       // reveal WITHOUT repositioning anything
    placeNewcomers(placed);               // give the newly visible nodes somewhere sensible to be
    rerender();
  }
  walk.push(node.id); openNode(node,false); centerOn(node);   // breadcrumb → back returns to the entity
}

/**
 * Position nodes that just became visible, without touching anyone already on the map.
 *
 * A chunk belongs near the entities that appeared in it, so each newcomer lands at the centroid of its
 * already-placed neighbours. Golden-angle jitter, because several chunks of one document share exactly one
 * neighbour and would otherwise land on identical coordinates — the welding defect a layout review already
 * caught once server-side. Newcomers with no placed neighbour keep their seed rather than being invented.
 */
function placeNewcomers(placedIds){
  const GOLDEN = 2.39996323;
  let k = 0;
  for(const n of NODES){
    if(placedIds.has(n.id)) continue;
    let sx=0, sy=0, c=0;
    for(const e of EDGES){
      const other = e.a===n ? e.b : (e.b===n ? e.a : null);
      if(other && placedIds.has(other.id)){ sx+=other.x; sy+=other.y; c++; }
    }
    if(!c) continue;                       // nothing to anchor to: leave the seed alone
    const a = k*GOLDEN, r = 26 + 5*(k%7);
    k++;
    n.x = sx/c + Math.cos(a)*r;
    n.y = sy/c + Math.sin(a)*r;
    n.vx = 0; n.vy = 0;
  }
}

function openNode(n, deep){

  if(!links.length){ sec.appendChild(el('div','quote', isChunk?'No entities extracted here.':'No semantic links yet.')); }

    const multi=Object.keys(kinds).length>1;
    Object.keys(kinds).forEach(k=>{
      if(multi || k!=='RELATED') sec.appendChild(el('span','kbadge',k)); // label the kind when it carries info

          const wb=el('div','wbar'), tr=el('div','track'); tr.style.width='34px'; const fl=el('div','fill'); fl.style.width=Math.max(6,Math.min(100,(w/4)*100))+'%'; tr.appendChild(fl); wb.appendChild(tr); wb.appendChild(el('span','wv','w '+w)); c.appendChild(wb);

  else if(curEdge){ (NODES.includes(curEdge.a)&&NODES.includes(curEdge.b))?openEdge(curEdge):showIdle(); } }

// --- scenes: save the current view (camera + provenance filter + selected node) and fly back to it later.
//
// TWO BACKING STORES, one shape. On file:// there is no server, so localStorage remains the sidecar. When
// SERVED the database is the source of truth (design §6) — before this, the served page still read
// localStorage, so a user who correctly followed the slice-2 migration opened the served viewer, saw NO
// scenes, and had every reason to conclude the migration had failed.
//
// A served scene is ANCHORED (node ids) rather than a camera, so it survives any re-settle. A local scene
// stores the camera. restoreScene handles both: anchors win when present.
const SKEY='tessera-scenes-'+(GRAPH.name||'graph');
let scenes=[], activeScene=null, pendingDeletes=[];

function loadScenes(){
  if(SERVED){ scenes=(GRAPH.scenes||[]).map(fromDbScene); return; }
  try{ scenes=JSON.parse(localStorage.getItem(SKEY))||[]; }catch(e){ scenes=[]; }
}
function fromDbScene(r){
  return { id:r.id, name:r.name, narr:r.narr||null, scale:r.scale, showProv:!!r.showProv,
           node:r.focusNode||null, anchors:r.anchors||[], version:r.version, persisted:true };
}
function toDbScene(s,i){
  return { id: s.persisted?s.id:undefined, name:s.name||'', narr:s.narr||null, scale:s.scale,
           showProv:!!s.showProv, focusNode:s.node||null,
           anchors: (s.anchors&&s.anchors.length) ? s.anchors : anchorsForCamera(s),
           legacyId: s.persisted?null:(s.id||null), ordinal:i, version:s.version };
}
/** Persist. On file:// that is localStorage; when SERVED it is an all-or-nothing PUT the server can 409. */
function persistScenes(){
  if(!SERVED){ try{ localStorage.setItem(SKEY, JSON.stringify(scenes)); }catch(e){} return; }
  // Take a copy but DO NOT clear yet: if the PUT fails, the scene is already gone from the local list while
  // its row is still in the database, so dropping the id here would strand the delete until the user thought
  // to do it again. Cleared only once the server has accepted it.
  const deletes=pendingDeletes.slice();
  const restoreDeletes=()=>{ for(const d of deletes) if(pendingDeletes.indexOf(d)<0) pendingDeletes.push(d); };
  fetch('/scenes',{ method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ scenes: scenes.map(toDbScene), deletes }) })
    .then(async res=>{
      if(res.status===409){
        restoreDeletes();
        // Someone else changed these scenes. All-or-nothing means nothing was applied, so re-read rather
        // than leaving the page showing edits the database never accepted.
        dropStatus('scenes changed elsewhere — reloading them');
        const fresh=await fetch('/scenes').then(r=>r.json()).catch(()=>null);
        if(fresh){ scenes=(fresh.scenes||[]).map(fromDbScene); renderScenes(); }
        return;
      }
      if(!res.ok){ restoreDeletes(); dropStatus('could not save scenes ('+res.status+')'); return; }
      pendingDeletes=pendingDeletes.filter(d=>deletes.indexOf(d)<0); // accepted — now they can go
      // Re-read so newly created scenes pick up the id and version the STORE minted for them; without this
      // the next save would look like a create and mint a duplicate.
      const fresh=await fetch('/scenes').then(r=>r.json()).catch(()=>null);
      if(fresh){ scenes=(fresh.scenes||[]).map(fromDbScene); renderScenes(); }
    })
    .catch(err=>{ restoreDeletes(); dropStatus('could not save scenes: '+err); });
}
function saveScene(name){ name=(name||'').trim(); if(!name){ renderScenes(); return; }
  const s={ id:'sc'+performance.now().toFixed(0), name, ox, oy, scale, showProv, node: selected?selected.id:null,
            anchors: SERVED?anchorsForCamera({ox,oy,scale}):null, persisted:false };
  scenes.push(s); activeScene=s.id; persistScenes(); renderScenes(); }
function restoreScene(s,dur){ activeScene=s.id;
  if(!!s.showProv!==showProv){ showProv=!!s.showProv; rebuild(); }   // match the saved provenance filter
  if(s.node){ const n=byId.get(s.node); if(n&&NODES.includes(n)){ walk=[]; openNode(n,false); } else showIdle(); } else showIdle();
  // Anchors win when the scene has them (served scenes always should). Fall back to a stored camera only if
  // one is actually there: a scene row whose anchors all resolved away has no camera either, and
  // flyTo(undefined, undefined, …) would throw the view somewhere meaningless. Leaving the camera put is the
  // honest no-op — the panel and provenance filter above have already been applied.
  const cam = (s.anchors&&s.anchors.length) ? cameraForAnchors(s.anchors, s.scale)
            : (Number.isFinite(s.ox)&&Number.isFinite(s.oy)) ? {ox:s.ox, oy:s.oy, scale:s.scale}
            : null;
  if(cam) flyTo(cam.ox, cam.oy, cam.scale, dur); // animate the camera rather than cutting (dur: tours glide slower)
  renderScenes(); }
function delScene(id){
  const s=scenes.find(x=>x.id===id);
  if(s&&s.persisted) pendingDeletes.push(id);
  scenes=scenes.filter(x=>x.id!==id); if(activeScene===id) activeScene=null;
  persistScenes(); renderScenes(); }

/** Move a scene from index `from` to index `to`. Extracted so a test can drive the reorder without a DOM. */
function moveScene(list, from, to){
  if(from===to||from<0||to<0||from>=list.length||to>=list.length) return list;
  const out=list.slice(); const [item]=out.splice(from,1); out.splice(to,0,item); return out;
}
function reorderScenes(from,to){
  const next=moveScene(scenes,from,to);
  if(next===scenes) return;
  scenes=next; persistScenes(); renderScenes();
}

// The rack lives in the LEFT column as a vertical stack. It used to be a bottom-centre row that grew a
// horizontal scrollbar once there were more than a handful of scenes — unreadable, and the left column had
// an unused gap the whole time. Vertical also gives drag-reorder somewhere obvious to grab.
function renderScenes(){ const box=$('scenes'); box.innerHTML='';
  box.appendChild(el('span','lab','scenes'));
  const list=el('div','list');
  let dragFrom=-1;

    const c=el('div','sc'+(s.id===activeScene?' on':''));

    c.addEventListener('dragstart', ev=>{ dragFrom=i; c.classList.add('dragging'); ev.dataTransfer.effectAllowed='move';

    c.addEventListener('dragover', ev=>{ ev.preventDefault(); ev.stopPropagation(); c.classList.add('over'); });
    c.addEventListener('dragleave', ()=>c.classList.remove('over'));
    c.addEventListener('drop', ev=>{ ev.preventDefault(); ev.stopPropagation(); c.classList.remove('over');
      const from = dragFrom>=0 ? dragFrom : Number(ev.dataTransfer.getData('text/plain'));

  });
  box.appendChild(list);
  const foot=el('div','foot');
  const add=el('span','add','+ save view'); add.title='save this view as a scene — captures the camera and, if a node is open, that node as the scene\'s focus (optional)';
  add.onclick=()=>{ const inp=document.createElement('input'); inp.placeholder='name this view…';
    add.replaceWith(inp); inp.focus();
    inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') saveScene(inp.value); else if(ev.key==='Escape') renderScenes(); });
    inp.addEventListener('blur', ()=> saveScene(inp.value)); };
  foot.appendChild(add);
  if(scenes.length){ const pl=el('span','add','▶ tour'); pl.title='play a tour through the saved scenes'; pl.onclick=()=>playTour(); foot.appendChild(pl); }
  // The export bridge is only meaningful on file://: served scenes are already in the database.
  if(!SERVED&&scenes.length){ const exp=el('span','add','⤓ export'); exp.title='export scenes to a file, so `tessera scenes import` can move them into the graph';
    exp.onclick=()=>exportScenes(); foot.appendChild(exp); }
  box.appendChild(foot);

// ═══ LAYOUT ENGINE ═══════════════════════════════════════════════════════════════════════════════════
// The bundle now carries a 48-d random projection of every node's stored vector (see export-viewer.ts), so
// the viewer can COMPUTE a layout instead of only displaying the one the CLI wrote.
//
// COMPUTING AND APPLYING ARE SESSION-SCOPED; PERSISTING IS A SEPARATE, EXPLICIT ACT. Nothing here writes to
// the database except the Save button, which posts to PUT /layout, is only offered when serving, and is
// refused unless the applied layout covered every node. Try layouts freely; committing one is a decision.
const EMB = GRAPH.embed || {};
let layoutRun = null;                       // the running optimiser, or null
const undoStack = [];                       // snapshots of {id -> [x,y]}, most recent last
const MAX_UNDO = 12;

function snapshot(){ const m={}; for(const n of nodes) m[n.id]=[n.x,n.y]; return m; }
function restore(m){ for(const n of nodes){ const p=m[n.id]; if(p){ n.x=p[0]; n.y=p[1]; } } }
function pushUndo(label){
  undoStack.push({label, pos:snapshot()});
  if(undoStack.length>MAX_UNDO) undoStack.shift();
}

// PCA to 2-d over the 48-d projection, for INITIALISATION. Kobak & Linderman (Nature Biotechnology 39:156,
// 2021) is blunt about this: informative initialisation, not the loss function, is what preserves global
// structure in both t-SNE and UMAP. Starting from noise is why inter-cluster distances usually mean nothing.
// Cheap here because it runs on 48 dims, not 768.
function pcaInit(ids){
  const K=ids.length, Dd=48;
  const M=ids.map(id=>EMB[id].slice());
  const mu=new Array(Dd).fill(0);
  for(const r of M) for(let j=0;j<Dd;j++) mu[j]+=r[j]/K;
  for(const r of M) for(let j=0;j<Dd;j++) r[j]-=mu[j];
  const comp=[];
  for(let c=0;c<2;c++){
    let w=new Array(Dd).fill(0).map((_,i)=>Math.sin(i*1.7+c)+0.1);
    for(let it=0;it<80;it++){
      const nx=new Array(Dd).fill(0);
      for(const r of M){ let d=0; for(let j=0;j<Dd;j++) d+=r[j]*w[j]; for(let j=0;j<Dd;j++) nx[j]+=r[j]*d; }
      const nn=Math.hypot(...nx)||1; w=nx.map(x=>x/nn);
    }
    const sc=M.map(r=>{ let d=0; for(let j=0;j<Dd;j++) d+=r[j]*w[j]; return d; });
    comp.push(sc);
    M.forEach((r,i)=>{ for(let j=0;j<Dd;j++) r[j]-=sc[i]*w[j]; });
  }
  return ids.map((_,i)=>[comp[0][i], comp[1][i]]);
}

// t-SNE. Same implementation as the projection tutorial, which was verified headless (rows sum to 1, no
// collapse). Runs over the nodes that are currently VISIBLE, so hiding provenance changes what is laid out.
function makeTsne(ids, perp, init, attraction){
  const n=ids.length, X=ids.map(id=>EMB[id]);
  const Dsq=new Float64Array(n*n);
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ let s=0; const a=X[i],b=X[j];
    for(let d=0;d<a.length;d++){ const t=a[d]-b[d]; s+=t*t; } Dsq[i*n+j]=s; Dsq[j*n+i]=s; }
  const P=new Float64Array(n*n), logU=Math.log(perp);
  for(let i=0;i<n;i++){
    let beta=1, lo=-Infinity, hi=Infinity;
    for(let t=0;t<50;t++){
      let sum=0,H=0;
      for(let j=0;j<n;j++){ if(i===j) continue; const p=Math.exp(-Dsq[i*n+j]*beta); P[i*n+j]=p; sum+=p; }
      sum=sum||1e-12;
      for(let j=0;j<n;j++){ if(i!==j) H+=Dsq[i*n+j]*P[i*n+j]; }
      H=Math.log(sum)+beta*H/sum;
      if(Math.abs(H-logU)<1e-5) break;
      if(H>logU){ lo=beta; beta = hi===Infinity ? beta*2 : (beta+hi)/2; }
      else { hi=beta; beta = lo===-Infinity ? beta/2 : (beta+lo)/2; }
    }
    let sum=0; for(let j=0;j<n;j++) if(i!==j) sum+=P[i*n+j]; sum=sum||1e-12;
    for(let j=0;j<n;j++) if(i!==j) P[i*n+j]/=sum;
  }
  const Q=new Float64Array(n*n);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) Q[i*n+j]=(P[i*n+j]+P[j*n+i])/(2*n);
  // scale the init small — t-SNE expects to start compact, and a large spread stalls early exaggeration
  const sc=Math.max(1e-6, Math.max(...init.flat().map(Math.abs)));
  const Y=init.map(p=>[p[0]/sc*1e-2, p[1]/sc*1e-2]);
  return { n, P:Q, Y, attraction: attraction ?? 1, gains:Y.map(()=>[1,1]), vel:Y.map(()=>[0,0]), iter:0,
    step(){
      const {n,Y}=this; const num=new Float64Array(n*n); let Z=0;
      for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
        const dx=Y[i][0]-Y[j][0], dy=Y[i][1]-Y[j][1], q=1/(1+dx*dx+dy*dy);
        num[i*n+j]=q; num[j*n+i]=q; Z+=2*q; }
      Z=Z||1e-12;
      // eta 200 (the value the tutorial used at n=260) DIVERGES here: measured on the real bundle it ran to
      // 1.2e+31 within 250 iterations. Two changes, and the clamp is the important one because it is a
      // guarantee rather than a tuning: no single step may move a point further than STEP_MAX, so the
      // optimiser cannot blow up on a corpus whose distance scale differs from the one it was tuned on.
      //
      // THE ATTRACTION KNOB. Böhm, Berens & Kobak (arXiv:2007.08902) showed t-SNE, UMAP and ForceAtlas2 are
      // ONE family separated by how hard the attractive term pulls relative to the repulsive one. The
      // mechanism was already sitting here: early exaggeration multiplies attraction by 12 for the first 100
      // iterations and then releases it to 1. Holding it at a chosen value instead of releasing to 1 IS the
      // spectrum. So `attraction` is not a new algorithm, it is the parameter that was always there with a
      // constant written into it. 1 is textbook t-SNE; higher pulls toward the continuous, connected
      // ForceAtlas2 end; lower gives repulsion the upper hand and scatters into islands.
      const exag=this.iter<100?12:this.attraction, mom=this.iter<250?0.5:0.8, eta=50, STEP_MAX=2;
      for(let i=0;i<n;i++){
        let gx=0,gy=0;
        for(let j=0;j<n;j++){ if(i===j) continue;
          const m=4*(this.P[i*n+j]*exag - num[i*n+j]/Z)*num[i*n+j];
          gx+=m*(Y[i][0]-Y[j][0]); gy+=m*(Y[i][1]-Y[j][1]); }
        for(const [d,g] of [[0,gx],[1,gy]]){
          this.gains[i][d]=Math.max(0.01,(Math.sign(g)===Math.sign(this.vel[i][d]))?this.gains[i][d]*0.8:this.gains[i][d]+0.2);
          let stp=mom*this.vel[i][d]-eta*this.gains[i][d]*g;
          if(stp>STEP_MAX) stp=STEP_MAX; else if(stp<-STEP_MAX) stp=-STEP_MAX;
          this.vel[i][d]=stp; Y[i][d]+=stp;
        }
      }
      let mx=0,my=0; for(let i=0;i<n;i++){ mx+=Y[i][0]; my+=Y[i][1]; }
      mx/=n; my/=n; for(let i=0;i<n;i++){ Y[i][0]-=mx; Y[i][1]-=my; }
      this.iter++;
    } };
}
// Map optimiser coordinates onto the world at roughly the scale the existing map uses, so switching layouts
// does not also teleport the camera.
function writeBack(ids, Y){
  let mx=0,my=0; for(const p of Y){ mx+=p[0]/Y.length; my+=p[1]/Y.length; }
  let r=0; for(const p of Y) r=Math.max(r, Math.hypot(p[0]-mx,p[1]-my));
  const k=(r>1e-9)? 620/r : 1;
  const byId=new Map(nodes.map(n=>[n.id,n]));
  ids.forEach((id,i)=>{ const n=byId.get(id); if(n){ n.x=(Y[i][0]-mx)*k; n.y=(Y[i][1]-my)*k; } });
}
// COMPUTE OFF-SCREEN, THEN ACCEPT. Brian's call, and it is the right one: a full run over ~2000 nodes is
// O(n^2) per iteration and takes on the order of a minute, so watching the map thrash for that long is not a
// preview, it is a distraction — and it destroys the very positions you would want to compare against. So the
// visible map does not move until you say so. The optimiser runs in requestAnimationFrame slices with a frame
// budget, which keeps panning and hovering responsive while it works.
let pending = null;    // {ids, t, total, done} — a computed layout awaiting a decision
const FRAME_MS = 10;   // under one 16ms frame, so panning stays smooth while the optimiser runs

function startLayout(perp, initMode, attraction, onTick){
  // ALL nodes with vectors, not just the visible ones. Laying out only what is on screen is what made a
  // subset save tear the map, and the stored layout covers every node anyway.
  const ids=nodes.filter(n=>EMB[n.id]).map(n=>n.id);
  if(ids.length<8) return null;
  const init = initMode==='pca' ? pcaInit(ids) : ids.map(id=>{ const n=nodes.find(x=>x.id===id); return [n.x,n.y]; });
  const t=makeTsne(ids, perp, init, attraction);
  const total=500;
  pending={ids, t, total, done:false, perp, initMode, attraction};
  layoutRun={stop:false};
  const loop=()=>{
    if(!layoutRun || layoutRun.stop) return;
    const until=performance.now()+FRAME_MS;
    do { t.step(); } while(t.iter<total && performance.now()<until);
    if(t.iter>=total){ pending.done=true; layoutRun=null; onTick(t.iter, true); return; }
    onTick(t.iter, false);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  return t;
}
/**
 * Did the applied layout cover EVERY node? Found by review: startLayout laid out only visible nodes that have
 * vectors, while the save handler wrote every node — so hiding provenance and then saving committed a map
 * half in t-SNE coordinates and half in CLI coordinates, permanently. Compared as SETS, because equal counts
 * with different ids is exactly how a tear slips through.
 */
function layoutCoversAll(applied, all){
  if(!applied) return false;
  const a=new Set(applied);
  if(a.size !== new Set(all).size) return false;
  for(const id of all) if(!a.has(id)) return false;
  return true;
}
/**
 * Is a computed layout safe to put on screen? STEP_MAX bounds a step, not a NaN — `NaN > STEP_MAX` is false,
 * so a NaN gradient still lands in Y, and writeBack then turns it into NaN world coordinates. The server
 * rejects those on save, but rendering garbage and relying on a later endpoint to object is the wrong order.
 * A fully collapsed result is finite and equally useless, so it is refused too.
 */
function layoutIsFinite(Y){
  if(!Y || !Y.length) return false;
  let mx=0,my=0;
  for(const p of Y){ if(!Number.isFinite(p[0])||!Number.isFinite(p[1])) return false; mx+=p[0]/Y.length; my+=p[1]/Y.length; }
  let r=0; for(const p of Y) r=Math.max(r, Math.hypot(p[0]-mx,p[1]-my));
  return Number.isFinite(r) && r > 1e-6;
}
let appliedIds = null;      // the id set the last APPLIED layout actually moved

function acceptLayout(){
  if(!pending) return;
  if(!layoutIsFinite(pending.t.Y)){ layoutStatus='refused: the run produced unusable coordinates'; pending=null; renderEdgeCtl(); return; }
  pushUndo('before layout (perplexity '+pending.perp+', attraction '+pending.attraction.toFixed(2)+')');
  writeBack(pending.ids, pending.t.Y);
  appliedIds = pending.ids.slice();
  pending=null;
  recomputeZoomCeiling();          // a new layout means new spacing, and t-SNE's is far tighter
  draw();
  fitAll();                       // the optimiser normalises to its own radius; bring the camera with it
}
function discardLayout(){
  if(layoutRun){ layoutRun.stop=true; layoutRun=null; }
  pending=null;
}

// --- edge budget control

// --- LAYOUT group: compute off-screen, apply, poke around, then persist if you like it -------------------
let layoutOpen=false, layoutPerp=10, layoutInit='pca', layoutAttr=1, layoutStatus='', saveMsg='';
function renderLayoutCtl(box){
  if(!Object.keys(EMB).length) return;                 // an older bundle carries no vectors
  const g=document.createElement('div'); g.className='grp'+(layoutOpen?'':' closed'); g.style.marginTop='13px';
  const gh=document.createElement('div'); gh.className='gh';

  g.appendChild(gh);

  const line=(h)=>{ const d=document.createElement('div'); d.innerHTML=h; gb.appendChild(d); return d; };

    b.textContent=label;

  // Attraction, on a log scale because the interesting range is multiplicative: 0.3x to 8x around 1.
  const AT=[0.3,0.5,0.7,1,1.5,2,3,4,6,8];
  const ai=AT.indexOf(layoutAttr)<0?3:AT.indexOf(layoutAttr);
  // Labels describe what was MEASURED on this corpus, not what the paper's framing implied. The first pass
  // called high attraction "connected (ForceAtlas2 end)"; measuring it showed the opposite reading is the
  // useful one — raising attraction collapses each cluster toward a point, so spread-over-median-neighbour
  // distance climbed from 34 at 0.3x to ~59,000 at 8x. Clusters get tighter and more separated, not more
  // continuous. Böhm et al.'s spectrum is real; the adjective I hung on its far end was not checked.
  const label = layoutAttr<0.8 ? 'looser, more evenly spread'
              : layoutAttr===1 ? 'textbook t-SNE'
              : layoutAttr>=4  ? 'clusters collapse to tight knots'
              : 'tighter clusters, wider gaps';
  line('<div style="display:flex;justify-content:space-between;margin-top:7px"><span>attraction</span><span style="color:var(--faint)">'+layoutAttr+'×</span></div>');
  const as=document.createElement('input'); as.type='range'; as.min='0'; as.max=String(AT.length-1); as.value=String(ai);
  as.style.cssText='width:100%;margin-top:2px'; as.disabled=!!layoutRun||!!pending;
  as.oninput=()=>{ layoutAttr=AT[Number(as.value)]; renderEdgeCtl(); };
  gb.appendChild(as);
  const al=document.createElement('div');
  al.style.cssText='margin-top:2px;color:var(--faint);font-size:10px'; al.textContent=label;
  gb.appendChild(al);

  const isel=document.createElement('select');
  isel.style.cssText='width:100%;margin-top:6px;background:var(--surface-3);color:var(--text);border:1px solid var(--line-2);border-radius:6px;padding:3px 5px;font-size:11px';
  isel.disabled=!!layoutRun||!!pending;
  for(const [v,t] of [['pca','start from PCA — keeps global shape'],['current','start from current positions']]){
    const o=document.createElement('option'); o.value=v; o.textContent=t; if(v===layoutInit) o.selected=true; isel.appendChild(o); }
  isel.onchange=()=>{ layoutInit=isel.value; renderEdgeCtl(); };
  gb.appendChild(isel);

  const bar=document.createElement('div'); bar.style.cssText='display:flex;gap:6px;margin-top:7px';
  if(layoutRun){
    bar.appendChild(btn('Stop', ()=>{ discardLayout(); layoutStatus='stopped'; renderEdgeCtl(); }, true));
  } else if(pending && pending.done){
    bar.appendChild(btn('Apply', ()=>{ acceptLayout(); layoutStatus='applied — pan around, then save or undo'; saveMsg=''; renderEdgeCtl(); }, true));
    bar.appendChild(btn('Discard', ()=>{ discardLayout(); layoutStatus=''; renderEdgeCtl(); }));
  } else {
    bar.appendChild(btn('Compute', ()=>{

  // A control that writes geometry as a side effect of being dragged would be the wrong contract entirely.
  const fullCover = layoutCoversAll(appliedIds, nodes.map(n=>n.id));
  if(SERVED && appliedIds && !pending){

    sb.textContent = fullCover ? 'Save this layout to the graph' : 'Cannot save — layout covered only part of the graph';
    sb.disabled = !fullCover;
    sb.style.cssText='width:100%;margin-top:6px;font-size:11px;padding:5px 6px;border-radius:6px;background:var(--surface-3);color:var(--text);border:1px solid var(--line-2);cursor:'+(fullCover?'pointer':'default')+(fullCover?'':';opacity:.5');
    if(fullCover) sb.onclick=async ()=>{

      try{
        const r=await fetch('/layout',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({positions})});
        const j=await r.json().catch(()=>({}));

  note.textContent = SERVED ? 'applying is local until you save' : 'file:// — layouts are local to this page';
