  g.appendChild(gb); box.appendChild(g);
}

// --- DROP TARGET (slice 3). Only active when the page is SERVED — a file:// bundle has no server to post
// to, so the handlers are not installed and the page behaves exactly as before.
const SERVED = location.protocol === 'http:' || location.protocol === 'https:';

// --- EXTRACTION DEBT. Chunks are written fast; extraction happens after. A map rendered mid-drain is
// INCOMPLETE, and it has to say so — otherwise "the graph looks thin" and "extraction has not run yet" are
// the same picture, which is the confusion the whole dirty-chunk model exists to remove.
// `b` may be a plain total or the {dirty,never,stale,failing} breakdown. The breakdown matters because the
// background drain does NOT touch every kind of debt: it skips stale-prompt chunks (re-extracting a corpus
// is a decision, not a side effect of dropping a file) and chunks past the attempt limit. A badge that said
// "a drop will handle this" about chunks no drop will ever touch would be a new silent lie in the exact
// place this batch went to remove one.
function setDirtyBadge(b){
  const el=$('gdirty'); if(!el) return;
  const d = (b && typeof b === 'object') ? b : { dirty: b||0, never: b||0, stale: 0, failing: 0 };
  if(!d.dirty && !d.draining){ el.classList.remove('on'); el.classList.remove('busy'); return; }
  // "extracting" and "awaiting" are different facts. A drop kicks a background drain, and a badge that
  // says only "awaiting" while the GPU is busy reads as nothing happening — which is exactly what it read
  // as the first time somebody dropped a file and had to ask whether anything was going on.
  el.classList.toggle('busy', !!d.draining);
  el.textContent = d.draining ? 'extracting… '+d.dirty+' left' : '+'+d.dirty+' awaiting extraction';
  const cmd='tessera extract '+(GRAPH.name||'<graph>');
  const lines=[d.dirty+' chunk(s) are written but not yet extracted, so their entities are not on this map yet.'];
  const auto = SERVED ? Math.max(0, d.never - d.failing) : 0;
  if(auto) lines.push(auto+' will extract in the background after a drop.');
  if(d.stale) lines.push(d.stale+' were extracted under an older prompt and need:  '+cmd);
  if(d.failing) lines.push(d.failing+' failed repeatedly and need:  '+cmd+' --retry-failed');
  if(!auto && !d.stale && !d.failing) lines.push('run:  '+cmd);
  el.title=lines.join('\n');
  el.classList.add('on');
}
setDirtyBadge(GRAPH.dirty||GRAPH.dirtyChunks||0);

// The bundle's count is only true at page-load. A drop reloads the page, which destroys the SSE stream, so
// without this the badge freezes at whatever was owed when the page rendered and a running drain is
// invisible. `GET /status` is the queryable fact; this is the thing that reads it.
let statusTimer=0;
function pollStatus(){
  if(!SERVED) return;
  clearTimeout(statusTimer);
  fetch('/status').then(r=>r.ok?r.json():null).then(st=>{
    if(!st) return;
    setDirtyBadge(st);
    // Poll only while work is ACTUALLY moving. Settled debt (a poison chunk nothing will retry) is a stable
    // fact already on the badge, and polling it forever would be a heartbeat that means nothing.
    if(st.draining) statusTimer=setTimeout(pollStatus, 4000);
  }).catch(()=>{});
}
if(SERVED) pollStatus();

loadScenes(); renderScenes(); renderEdgeCtl();
function dropUI(){
  let el=document.getElementById('dropzone');
  if(!el){ el=document.createElement('div'); el.id='dropzone';
    el.style.cssText='position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;'
      +'background:rgba(8,11,18,.82);backdrop-filter:blur(2px);font-size:18px;color:var(--text);pointer-events:none';
    document.body.appendChild(el); }
  return el;
}
function dropStatus(msg, sticky){
  let el=document.getElementById('dropstatus');
  if(!el){ el=document.createElement('div'); el.id='dropstatus';
    el.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:41;background:var(--surface-2);'
      +'border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:12px;color:var(--text);box-shadow:0 6px 24px rgba(0,0,0,.4)';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.display='block';
  if(!sticky) setTimeout(()=>{ el.style.display='none'; }, 4000);
}
if(SERVED){
  const zone=dropUI();
  let depth=0;
  // These listeners are on WINDOW, so every drag reaches them — including dragging a scene row to reorder
  // it, which lit the full-screen "drop a .md or .txt" overlay over the map. The gesture was internal and
  // the UI claimed it was about to ingest a file.
  //
  // Test for what a file drag POSITIVELY is rather than trying to suppress each internal drag: a file drag
  // carries "Files" in dataTransfer.types, and a scene reorder never will. Suppressing case by case would
  // mean every future draggable thing in this page reintroduces the same bug.
  addEventListener('dragenter', e=>{ if(!isFileDrag(e)) return; e.preventDefault(); if(++depth===1){ zone.textContent='drop a .md or .txt to add it to this map'; zone.style.display='flex'; } });
  addEventListener('dragleave', e=>{ if(!isFileDrag(e)) return; e.preventDefault(); if(--depth<=0){ depth=0; zone.style.display='none'; } });
  addEventListener('dragover', e=>{ if(!isFileDrag(e)) return; e.preventDefault(); });
  addEventListener('drop', async e=>{
    if(!isFileDrag(e)) return;   // a scene reorder is not an ingest
    e.preventDefault(); depth=0; zone.style.display='none';
    const all=(e.dataTransfer && e.dataTransfer.files) ? Array.from(e.dataTransfer.files) : [];
    if(!all.length) return;
    const {supported, rejected} = partitionDrop(all);
    if(!supported.length){ dropStatus('only .md and .txt are supported — nothing ingested ('+rejected.join(', ')+')'); return; }

    // The SSE stream now carries TWO phases: 'chunk' while files are being written (fast) and 'extract'
    // while the server drains the queue in the background. One stream for the whole drop, not one per file.
    const es=new EventSource('/events');
    let phaseNote='';
    es.onmessage=ev=>{
      try{ const p=JSON.parse(ev.data);
        if(p.phase==='chunk') dropStatus(phaseNote+'chunking — '+Math.min(p.i+1,p.of)+' of '+p.of+'…', true);
        else if(p.phase==='extract') dropStatus('extracting in the background — chunk '+p.i+' of '+p.of+'… (you can keep working)', true);
        else if(p.phase==='error') dropStatus('extraction failed: '+p.message);
        else if(p.phase==='done' && p.dirty!==undefined) setDirtyBadge(p.dirty);
      }catch(_){}
    };

    let queued=0, added=0, dedup=0, failed=[];
    try{
      // Sequential, not parallel: the server is single-flight and would 409 concurrent posts. Each POST is
      // now fast (chunking only), so a multi-file drop is seconds rather than the length of an extraction.
      for(let i=0;i<supported.length;i++){
        const f=supported[i];
        phaseNote=supported.length>1 ? '('+(i+1)+'/'+supported.length+') ' : '';
        dropStatus(phaseNote+'reading '+f.name+'…', true);
        try{
          const res=await fetch('/ingest',{ method:'POST', headers:{'X-Tessera-Filename': f.name}, body: await f.arrayBuffer() });
          const txt=await res.text();
          if(!res.ok){ failed.push(f.name+' ('+res.status+')'); continue; }
          const r=JSON.parse(txt);
          if(r.skipped && !r.queued){ dedup++; continue; }
          added++; queued+=(r.queued||0);
          if(r.dirty!==undefined) setDirtyBadge(r.dirty);
        }catch(err){ failed.push(f.name); }
      }
      dropStatus(summariseDrop({added, queued, dedup, rejected, failed}), queued>0);
      // v1 reloads rather than delta-patching the open map (design §5, deferred). Layout is durable and
      // additive, so the reload keeps every position you were looking at. Reload once for the whole drop.
      if(added>0) setTimeout(()=>location.reload(), 1400);
      // Nothing new to render, so no reload — but a drain may still be running, so start watching it.
      else { es.close(); pollStatus(); }
    }catch(err){ es.close(); dropStatus('ingest failed: '+err); }
  });
}

// Split a dropped FileList into what we can ingest and what we cannot. Extracted so a test can drive it
// without a DOM: the bug this replaces was `files[0]` — dropping three files ingested one and said nothing
// about the other two, which is silent data loss in a system whose whole point is completeness.
// Does this drag carry FILES? Everything else on this page that can be dragged is internal (a scene row
// being reordered), and the window-level ingest handlers must ignore those. `types` is array-LIKE, not an
// Array, so index rather than .includes.
function isFileDrag(e){
  const t = e && e.dataTransfer && e.dataTransfer.types;
  if(!t) return false;
  for(let i=0;i<t.length;i++) if(t[i]==='Files') return true;
  return false;
}

function partitionDrop(files){
  const ok=f=>/\.(md|txt)$/i.test(f.name);
  return { supported: files.filter(ok), rejected: files.filter(f=>!ok(f)).map(f=>f.name) };
}

// One honest sentence for a whole drop. Every outcome is NAMED — files queued, files already present,
// files of the wrong type, files that errored — because the old handler reported only the first file.
function summariseDrop(s){
  const parts=[];
  if(s.added) parts.push(s.added+' file'+(s.added===1?'':'s')+' queued ('+s.queued+' chunk'+(s.queued===1?'':'s')+')');
  if(s.dedup) parts.push(s.dedup+' already in this map');
  if(s.rejected.length) parts.push(s.rejected.length+' unsupported: '+s.rejected.join(', '));
  if(s.failed.length) parts.push(s.failed.length+' failed: '+s.failed.join(', '));
  return parts.length ? parts.join(' · ') : 'nothing to add';
}

// --- scene EXPORT: the one-way door (design §5). localStorage is origin-scoped, so once tessera serves the
// viewer over http://127.0.0.1:PORT these scenes are unreachable from the new page. A file:// page cannot
// write SQLite, so the crossing is a two-artifact bridge: download here, `tessera scenes import` there.
//
// Each saved scene stores only a CAMERA (ox/oy/scale). We recover anchors by replaying that camera and
// asking which nodes were in frame — so a scene stops meaning "point the camera here" and starts meaning
// "show me these things", which survives any future re-settle.
//
// Mirrors selectAnchors() in src/scenes/scene.ts; test/scenes-bridge.test.ts extracts this function and
// asserts the two agree on the same input, so they cannot drift apart.
const ANCHOR_CAP=12, ANCHOR_FALLBACK=3;
function anchorsForCamera(cam){
  // NODES, not `nodes`: only the VISIBLE set. Hidden provenance nodes never receive stored layout (they have
  // no rows until slice 4), so they sit at their seed-ring coordinates near the world origin — inside exactly
  // the frames people save. They also keep a stale `deg` from any earlier `h` toggle, so they can outrank
  // real nodes in the sort. Anchoring a scene to them writes invisible chunk ids through the one-way door,
  // permanently, which is the corruption anchors exist to prevent.
  const pool = NODES;
  const inView = pool.filter(n=>{ const sx=n.x*cam.scale+cam.ox, sy=n.y*cam.scale+cam.oy;
    return sx>=0 && sx<=W && sy>=0 && sy<=H; });
  if(inView.length) return inView.slice().sort((a,b)=> b.deg-a.deg || (a.id<b.id?-1:1)).slice(0,ANCHOR_CAP).map(n=>n.id);
  const cx=(W/2-cam.ox)/cam.scale, cy=(H/2-cam.oy)/cam.scale;
  return pool.slice().sort((a,b)=> Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy) || (a.id<b.id?-1:1))
    .slice(0,ANCHOR_FALLBACK).map(n=>n.id);
}
// The inverse of anchorsForCamera: given the anchor node ids a scene was saved with, frame them.
// Mirrors frameAnchors() in src/scenes/scene.ts — test/scenes-bridge.test.ts extracts this and asserts the
// two agree on the same input, so a change to one that is not made to the other fails the build.
//
// scale = min(stored, fit) is load-bearing: honour the zoom the user chose, but if the cluster has spread
// since the scene was saved, zoom out enough that they still see the thing they saved. Pure stored-scale
// frames the middle of a cluster that no longer fits; pure refit throws away a deliberate close-up.
const FIT_FRACTION=0.7, ANCHOR_EPS=1e-6;
function cameraForAnchors(ids, storedScale){
  const pts=[];
  for(const id of ids){ const n=byId.get(id); if(n&&NODES.includes(n)) pts.push(n); }
  if(!pts.length) return null;   // every anchor is gone or hidden — leave the camera alone rather than guessing
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  const minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const bw=Math.max(maxX-minX, ANCHOR_EPS), bh=Math.max(maxY-minY, ANCHOR_EPS);
  const fit=Math.min((W*FIT_FRACTION)/bw, (H*FIT_FRACTION)/bh);
  const sc=Math.min(storedScale, fit);
  return { ox: W/2-cx*sc, oy: H/2-cy*sc, scale: sc };
}
function exportScenes(){
  if(!scenes.length){ alert('No scenes saved in this browser to export.'); return; }
  const payload = { graph: GRAPH.name||'graph',
    scenes: scenes.map((s,i)=>({ name:s.name||'', narr:s.narr||null, scale:s.scale, showProv:!!s.showProv,
      focusNode:s.node||null, anchors:anchorsForCamera(s), legacyId:s.id||null, ordinal:i })) };
  const blob = new Blob([JSON.stringify(payload,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (GRAPH.name||'graph')+'-scenes.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

// --- tours: play the saved scenes as a guided walkthrough — the camera flies stop→stop, narration per stop.
// v1: one implicit tour = all scenes in save order; narration lives on the scene. (Named tours + drag-reorder next.) ---
let tour=null;
function playTour(){ if(!scenes.length) return; tour={ i:-1, playing:true, timer:0 }; $('scenes').style.display='none'; tourGo(0); }
function tourGo(i){ if(!tour) return; tour.i=i; restoreScene(scenes[i], 1200); renderNow(); if(tour.playing) armAutoplay(); } // 1200ms: a slow, cinematic glide between narrated stops
function armAutoplay(){ clearTimeout(tour.timer); tour.timer=setTimeout(()=>{ if(tour.i<scenes.length-1) tourGo(tour.i+1); else { tour.playing=false; renderNow(); } }, 8000); }
function tourStep(d){ if(!tour) return; clearTimeout(tour.timer); tourGo(Math.max(0,Math.min(scenes.length-1,tour.i+d))); }
function tourToggle(){ if(!tour) return; tour.playing=!tour.playing; if(tour.playing) armAutoplay(); else clearTimeout(tour.timer); renderNow(); }
function exitTour(){ if(tour){ clearTimeout(tour.timer); tour=null; } $('nowplaying').style.display='none'; $('scenes').style.display=''; renderScenes(); }
function renderNow(){ const np=$('nowplaying'); np.style.display='block'; np.innerHTML='';
  const prog=el('div','prog'); scenes.forEach((s,i)=> prog.appendChild(el('i', i<=tour.i?'on':''))); np.appendChild(prog);
  const body=el('div','body'), ctrl=el('div','ctrl');
  const prev=el('span','b2','◀'); prev.onclick=()=>tourStep(-1);
  const pp=el('span','b2 play', tour.playing?'❙❙':'▶'); pp.onclick=()=>tourToggle();
  const next=el('span','b2','▶'); next.onclick=()=>tourStep(1);
  ctrl.append(prev,pp,next); body.appendChild(ctrl);
  const mid=el('div','mid'), s=scenes[tour.i];
  mid.appendChild(el('div','st','stop '+(tour.i+1)+' of '+scenes.length+'  ·  '+(s.name||'')));
  const ta=document.createElement('textarea'); ta.className='narr'; ta.rows=2; ta.placeholder='add narration for this stop…'; ta.value=s.narr||'';
  ta.oninput=()=>{ s.narr=ta.value; persistScenes(); }; mid.appendChild(ta); body.appendChild(mid);
  const ex=el('span','exit','exit'); ex.onclick=()=>exitTour(); body.appendChild(ex);
  np.appendChild(body);
}

rebuild(); showIdle(); draw();
</script>
</body>
</html>
